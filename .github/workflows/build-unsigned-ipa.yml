name: Build Unsigned IPA

# 把 LIZI 粒子播放器（woshi32s/liziair 的 1:1 iOS 复刻：WKWebView 壳 +
# Swift 本地服务）编成未签名 IPA，供侧载工具（AltStore、Sideloadly、
# eSign、全能签等）用自己的 Apple ID 重签后安装。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    # 2026-11-17 实测：macOS arm64 编译机池子没空，Placard 连续 5 次排队 16-17 分钟后被取消；
    # 改成 macos-26-intel 后第 7 次不到 1 分钟接单、4 分钟编完成功（同一个 Xcode，照样编 arm64 的 iOS 包）。
    # 所以这里直接用 macos-26-intel，不用 macos-latest / macos-26 / xcode-27。
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 构建信息（第 6 轮）：把 commit / 构建号 / 日期写进 public/version.json，
      # 前端设置页「关于 → 构建」显示 commit 短 hash，真机排障先看这里对 hash。
      # 文件只在构建机上生成，不进 git 提交（前端读不到时显示「未知构建」）。
      - name: Write build version info
        run: |
          printf '{"commit":"%s","build":"%s","date":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/version.json
          cat public/version.json
          # Cache-bust 核心前端文件：WKWebView 升级安装后缓存保留旧 JS，
          # 服务端 no-store 只对新响应生效，旧缓存条目不经服务端直接命中；
          # 带 commit 的 URL 才能让升级后的首次加载必走新文件。
          # __BUILD__ 占位只在构建机上替换成 commit，不进 git 提交。
          sed -i '' "s/__BUILD__/$GITHUB_SHA/g" public/index.html public/m/index.html
          grep -o 'api.js?v=[0-9a-f]*' public/index.html | head -1

      # project.yml 是唯一事实来源（XcodeGen）；重新生成 Xcode 工程，
      # 保证 archive 包含 project.yml 里的全部 target 与资源。
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Archive the iOS app (unsigned)
        run: |
          mkdir -p .build
          xcodebuild archive \
            -project ios/Lizi.xcodeproj \
            -scheme Lizi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath .build/Lizi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify the app bundle
        run: |
          APP_PATH="$(find .build/Lizi.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          echo "app: $APP_PATH"
          ls "$APP_PATH"
          echo "--- public/ must be a folder reference with the full frontend ---"
          test -d "$APP_PATH/public" || { echo "::error::public/ missing in app bundle"; exit 1; }
          ls "$APP_PATH/public" | head
          test -f "$APP_PATH/public/index.html" || { echo "::error::public/index.html missing"; exit 1; }
          test -f "$APP_PATH/public/version.json" || { echo "::error::public/version.json missing (build step did not write it)"; exit 1; }
          cat "$APP_PATH/public/version.json"
          du -sh "$APP_PATH/public"
          echo "--- bundle id / arch ---"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist"
          lipo -archs "$APP_PATH/Lizi"
          echo "--- Live Activity extension must be embedded ---"
          test -d "$APP_PATH/PlugIns/LiziLiveActivity.appex" || { echo "::error::LiziLiveActivity.appex missing in app bundle"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/PlugIns/LiziLiveActivity.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Print NSExtension:NSExtensionPointIdentifier" "$APP_PATH/PlugIns/LiziLiveActivity.appex/Info.plist"
          echo "--- Live Activities must be declared on the main app (r16: r15 shipped without these keys, island never started) ---"
          test "$(/usr/libexec/PlistBuddy -c "Print NSSupportsLiveActivities" "$APP_PATH/Info.plist")" = "true" || { echo "::error::NSSupportsLiveActivities missing/false in app Info.plist"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c "Print NSSupportsLiveActivitiesFrequentUpdates" "$APP_PATH/Info.plist")" = "true" || { echo "::error::NSSupportsLiveActivitiesFrequentUpdates missing/false in app Info.plist"; exit 1; }

      - name: Package the IPA
        run: |
          mkdir -p Payload dist
          APP_PATH="$(find .build/Lizi.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in archive" >&2
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr dist/lizi.ipa Payload

      - name: Upload the IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizi-ipa
          path: dist/lizi.ipa
          if-no-files-found: error

  # 原生版（P0 脚手架起）：与壳版 job 完全独立的 runner / archive / artifact，
  # 壳版 job 一行不动。原生包里没有 public/，所以不写 public/version.json、
  # 不做前端 cache-bust；构建信息改写进原生 target 的生成 Swift 文件
  # （LiziNativeBuildInfo，见 NativeHomeView），「关于 → 构建」读它。
  ipa-native:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 构建信息（原生版）：把 commit / 构建号 / 日期写进生成文件
      # ios/Sources/LiziNative/BuildInfo.generated.swift（构建机上生成，
      # 不进 git 提交）。必须在 XcodeGen 之前写，否则 glob 收不到这个文件。
      - name: Write native build info
        run: |
          cat > ios/Sources/LiziNative/BuildInfo.generated.swift <<EOF
          // Generated at build time by the native job in build-unsigned-ipa.yml.
          // Do not edit by hand; not committed.
          import Foundation
          enum LiziNativeBuildInfo {
              static let commit = "$GITHUB_SHA"
              static let build = "$GITHUB_RUN_NUMBER"
              static let date = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              static let shortCommit = String(commit.prefix(7))
          }
          EOF
          cat ios/Sources/LiziNative/BuildInfo.generated.swift

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Archive the native iOS app (unsigned)
        run: |
          mkdir -p .build
          xcodebuild archive \
            -project ios/Lizi.xcodeproj \
            -scheme LiziNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath .build/LiziNative.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify the native app bundle
        run: |
          APP_PATH="$(find .build/LiziNative.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          echo "app: $APP_PATH"
          ls "$APP_PATH"
          echo "--- native must NOT bundle the web frontend ---"
          test ! -d "$APP_PATH/public" || { echo "::error::public/ must not be in the native app bundle"; exit 1; }
          echo "--- bundle id / arch ---"
          test "$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")" = "com.lty5201.lizi-native" || { echo "::error::native bundle id is not com.lty5201.lizi-native"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist"
          lipo -archs "$APP_PATH/LiziNative"
          echo "--- URL scheme must be lizinative (shell uses lizi) ---"
          test "$(/usr/libexec/PlistBuddy -c "Print CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP_PATH/Info.plist")" = "lizinative" || { echo "::error::native URL scheme is not lizinative"; exit 1; }
          echo "--- r35-11: island re-added — native must embed exactly LiziNativeIsland.appex (r28 removal superseded) ---"
          test -d "$APP_PATH/PlugIns/LiziNativeIsland.appex" || { echo "::error::LiziNativeIsland.appex missing in native app bundle"; exit 1; }
          test "$(ls -d "$APP_PATH"/PlugIns/*.appex | wc -l | tr -d ' ')" = "1" || { echo "::error::native app must embed exactly one .appex (LiziNativeIsland)"; exit 1; }
          echo "--- structured resources must be present (r19 lesson: XcodeGen flattens resources dirs) ---"
          test -f "$APP_PATH/stages/001-particle-lyrics.html" || { echo "::error::stages/ missing in native app bundle"; exit 1; }
          test -f "$APP_PATH/GalleryHTML/forms-labs/index.html" || { echo "::error::GalleryHTML/forms-labs/index.html missing"; exit 1; }
          test -f "$APP_PATH/assets/fonts/ZCOOLKuaiLe-Regular.woff2" || { echo "::error::assets/fonts/ZCOOLKuaiLe-Regular.woff2 missing"; exit 1; }
          echo "--- r31: sponsored LX source removed — LXSponsored/ must NOT be in the bundle ---"
          test ! -d "$APP_PATH/LXSponsored" || { echo "::error::LXSponsored/ must not be in the native app bundle (r31 removed the sponsored source)"; exit 1; }

      - name: Package the native IPA
        run: |
          mkdir -p Payload dist
          APP_PATH="$(find .build/LiziNative.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in archive" >&2
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr dist/lizi-native.ipa Payload

      - name: Upload the native IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizi-native-ipa
          path: dist/lizi-native.ipa
          if-no-files-found: error
