<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>504 · 已发送</title>
<script src="assets/custom-bg.js"></script>
<style>
/* 504 · 已发送 —— r55 全删重写（横屏竖屏都重写，不留旧代码）。
   设计：竖屏按 r53 定稿 11 条；横屏按 r55 批过的稿（与竖屏同一套，
   左边歌词左缘挪到 68 避开真灵动岛）。
   实现：没有运镜——手机永远平放、居中、贴满，不平移、不旋转、不缩放、
   不回弹；横屏直接拖手机可以换个角度看（自由视角，见 JS 第 10 节）；
   点下面语音条可以暂停/继续播。
   字体（r55 用户发来的 kitty-__ing__8.ttf，内部名 kitty-加载ing长腿8，
   12,023,284 B，随舞台资源走，见 stages/kitty-__ing__8.ttf）：舞台全部文字
   的 font-family 只走 --stageFont 这一处变量，@font-face 声明 KittyStage
   指向该文件，body 经变量用它。r56 例外：已发送蓝气泡（.bub.r）改用小米兰亭
   Pro（MiLanPro-Thin.ttf，见下 @font-face），回退仍是 --stageFont；灰气泡与
   标题等仍走 --stageFont，一字不动。 */
@font-face{font-family:'KittyStage';src:url('kitty-__ing__8.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
/* r56：已发送蓝气泡改用小米兰亭 Pro（MiLanPro-Thin.ttf，内部 family「MI Lan Pro」、
   Thin 字重 = 100，28,666 字形；随舞台资源走，见 stages/MiLanPro-Thin.ttf）。
   只给 .bub.r 用（见下），灰气泡与标题等仍走 --stageFont（KittyStage），一字不动。 */
@font-face{font-family:'MiLanPro';src:url('MiLanPro-Thin.ttf') format('truetype');font-weight:100;font-style:normal;font-display:swap}
:root{--ac:150,165,255;--islandPad:48px;
      --stageFont:'KittyStage',"SF Pro Text",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{font-family:var(--stageFont);
     -webkit-user-select:none;user-select:none;cursor:default}

/* ================= 背景：黑 ================= */
.bg{position:fixed;inset:0;
    background:radial-gradient(118% 88% at 66% 40%,#141418 0%,#0b0b0e 42%,#050507 72%,#000 100%)}
.glow{position:fixed;inset:-25%;pointer-events:none;
      background:radial-gradient(circle at 64% 44%,rgba(var(--ac),.20),rgba(var(--ac),.07) 30%,rgba(var(--ac),0) 56%);
      transition:background 1.6s ease}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.4;mix-blend-mode:overlay}

/* ================= 舞台 ================= */
.stage{position:fixed;inset:0}
.anchor{position:absolute;left:63%;top:50%;transform:translate(-50%,-50%);
        perspective:1250px;perspective-origin:48% 44%}

/* 手机平放：基础机位就是平的，不做任何运镜；只有自由视角拖动时
   JS 才写内联 transform（见第 10 节），平时这里永远是 none */
.tilt{position:relative;transform-style:preserve-3d;will-change:transform;transform:none}
/* 视差：鼠标带着转一点点，挂在摄影机里侧（桌面才有鼠标，手机上不触发） */
.par{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.75,.28,1)}
.float{transform-style:preserve-3d;animation:float 12s ease-in-out infinite alternate}
@keyframes float{
  from{transform:translateY(-7px)}
  to  {transform:translateY(8px)}
}
.box{position:relative;transform-style:preserve-3d;transform:scale(calc(var(--k,1) * 0.5))}

/* 机身厚度：实心片沿 z 轴挤出（约 44px），自由视角转起来是一条金属侧壁 */
.layers{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.layers i{position:absolute;inset:0;border-radius:112px;background:#2a2a30;
          -webkit-backface-visibility:hidden;backface-visibility:hidden}

/* 机身周围的一圈冷光，把手机从黑里托起来 */
.halo{position:absolute;left:50%;top:50%;width:760px;height:1060px;pointer-events:none;
      transform:translate(-50%,-50%) scale(var(--k,1));
      background:radial-gradient(46% 44% at 50% 50%,rgba(150,165,255,.11),rgba(120,130,190,.05) 42%,rgba(0,0,0,0) 70%)}

.phone{position:relative;width:390px;height:844px;border-radius:56px;transform-origin:50% 50%;
       zoom:2;
       background:linear-gradient(146deg,#3d3d45 0%,#17171b 15%,#4e4e58 29%,#0d0d11 47%,
                  #36363e 63%,#101014 81%,#2e2e35 100%);
       box-shadow:
         0 0 0 .8px rgba(255,255,255,.20) inset,
         0 1.5px 2px rgba(255,255,255,.26) inset,
         0 -2px 5px rgba(0,0,0,.92) inset,
         0 0 60px -6px rgba(150,165,255,.10),
         0 40px 90px -30px rgba(0,0,0,.95)}

/* ================= 屏幕 ================= */
.screen{position:absolute;inset:6px;border-radius:50px;overflow:hidden;background:#fff;
        isolation:isolate;display:flex;flex-direction:column}

/* --- 状态栏：时间/信号/WiFi/电量已删，只留 54px 空占位 --- */
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;
      padding:0 30px;position:relative;z-index:10}

/* --- 导航条：返回箭头已删，只留名字；左 padding 30px 让名字 x 不动 --- */
.nav{height:42px;flex:none;display:flex;align-items:center;padding:0 8px 0 30px;gap:2px;position:relative;z-index:10}
.nav__n{font-size:13px;font-weight:600;color:#000;letter-spacing:-.1px;
        max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.88}

/* --- 会话头：头像上移与导航文字平齐——.hd 负边距上提 58px，
   头像中心与导航文字中心同高（75pt）；头像实时显示当前歌封面 --- */
.hd{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0 15px;margin-top:-58px}
.hd__av{width:70px;height:70px;border-radius:50%;overflow:hidden;position:relative;
        background:linear-gradient(142deg,rgba(var(--ac),.55),rgba(var(--ac),.92));
        display:grid;place-items:center;
        box-shadow:0 5px 16px -8px rgba(30,34,54,.5),0 0 0 .5px rgba(0,0,0,.05) inset}
.hd__av::after{content:'';position:absolute;inset:0;border-radius:50%;
               background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,0) 46%)}
.hd__av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}
.hd__av b{font-size:27px;font-weight:500;color:rgba(255,255,255,.94);position:relative;z-index:1}
.hd__n{font-size:15.5px;font-weight:600;color:#000;letter-spacing:-.2px;max-width:82%;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.hd__a{font-size:12px;color:#6e6e76;letter-spacing:.2px;max-width:82%;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd__s{font-size:11px;color:#9c9ca4;letter-spacing:.35px}

/* --- 对话 --- */
.chat{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
      background:radial-gradient(130% 85% at 48% 26%,#ffffff 0%,#fdfdfe 52%,#f7f7fa 84%,#f2f2f6 100%)}
.chat::before{content:'';position:absolute;left:0;right:0;top:0;height:54px;z-index:6;pointer-events:none;
              background:linear-gradient(#fff 22%,rgba(255,255,255,0))}
.thread{position:absolute;left:0;right:0;top:0;height:0;
        transition:transform .56s cubic-bezier(.24,.86,.3,1)}
.stamp{position:absolute;left:0;right:0;top:10px;z-index:7;text-align:center;
       font-size:10.5px;font-weight:500;color:#b6b6be;letter-spacing:.5px;pointer-events:none;
       transition:opacity .4s ease}

.bub{position:absolute;max-width:var(--bw,272px);padding:8px 14px;border-radius:19px;
     font-size:16px;line-height:22px;letter-spacing:0;word-break:break-word;
     z-index:1;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.9,.3,1),
       box-shadow .5s ease}
.bub.cur{box-shadow:0 3px 14px -6px rgba(40,44,70,.30)}
.bub span{opacity:.34;transition:opacity .32s ease}
.bub span.on{opacity:1}
.bub.r{right:12px;background:#0b84ff;color:#fff;border-bottom-right-radius:0;font-family:'MiLanPro',var(--stageFont)}
.bub.l{left:12px;background:#e9e9eb;color:#000;border-bottom-left-radius:0}
/* 气泡尾巴：向内压 2px 与本体重叠，消除接缝 */
.bub::after{content:'';position:absolute;bottom:0;width:9px;height:16px;
            background-repeat:no-repeat;background-size:9px 16px;pointer-events:none}
.bub.r::after{right:-5px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='16'><path d='M3 0 C3.3 7.4 5.2 12 9 16 L3 16 Z' fill='%230b84ff'/></svg>")}
.bub.l::after{left:-5px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='16'><path d='M6 0 C5.7 7.4 3.8 12 0 16 L6 16 Z' fill='%23e9e9eb'/></svg>")}

/* 正在输入… */
.typing{position:absolute;height:33px;padding:0 15px;border-radius:19px;display:flex;align-items:center;
        gap:4.5px;z-index:2;pointer-events:none;opacity:0;
        transform:scale(.9) translateY(6px);transform-origin:0 100%;
        transition:opacity .3s ease,transform .36s cubic-bezier(.2,1.2,.4,1)}
.typing.on{opacity:1;transform:none}
.typing.l{left:12px;background:#e9e9eb;transform-origin:0 100%}
.typing.r{right:12px;background:#0b84ff;transform-origin:100% 100%}
.typing i{width:6px;height:6px;border-radius:50%;display:block;animation:dot 1.15s ease-in-out infinite}
.typing.l i{background:#9c9ca3}
.typing.r i{background:rgba(255,255,255,.94)}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,62%,100%{transform:translateY(0);opacity:.4}32%{transform:translateY(-3.4px);opacity:1}}

/* --- 语音消息气泡（点按暂停/继续播，见 JS 第 10.5 节） --- */
.rec{flex:none;display:flex;padding:2px 12px 10px;justify-content:flex-start;cursor:pointer}
.rec__b{display:flex;align-items:center;gap:9px;height:38px;padding:0 15px;border-radius:19px;
        background:#e9e9eb;border-bottom-left-radius:3px;position:relative;max-width:78%}
.rec__b::after{content:'';position:absolute;left:-4px;bottom:0;width:8px;height:16px;
               background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='16'><path d='M6 0 C5.7 7.2 3.8 11.8 0 15.8 L0 16 L6 16 Z' fill='%23e9e9eb'/></svg>") no-repeat;
               background-size:8px 16px;pointer-events:none}
.rec__i{width:9px;height:12px;border-left:3px solid #8e8e93;border-right:3px solid #8e8e93;
        border-top:0;border-bottom:0;flex:none;margin-left:1px}
/* 暂停态（停时）：显示三角（点一下继续播）；播放时基础样式是两道竖杠（点一下暂停） */
.rec__b.paused .rec__i{width:0;height:0;border-left:9px solid #8e8e93;border-top:6px solid transparent;
        border-bottom:6px solid transparent;flex:none;margin-left:1px}
.rec__w{position:relative;flex:0 1 auto;height:18px;min-width:100px}
.rec__w i{position:absolute;top:0;bottom:0;width:2px;background:#b0b0b7;border-radius:1px;
          transform:scaleY(.18);transform-origin:center;transition:transform .13s linear,background .3s ease}
.rec__w i.ps{background:#0b84ff}
.rec__t{font-size:12px;color:#8e8e93;font-variant-numeric:tabular-nums;flex:none;letter-spacing:.2px}

/* --- 输入条（iMessage 占位字已删，留空框） --- */
.bar{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px 6px}
.bar__p{width:31px;height:31px;border-radius:50%;background:#f1f1f4;flex:none;
        display:grid;place-items:center;color:#8a8a90;font-size:20px;font-weight:300;line-height:1;
        padding-bottom:2px}
.bar__in{flex:1 1 auto;height:35px;border-radius:18px;border:1px solid #e4e4e8;
         display:flex;align-items:center;padding:0 13px;color:#c5c5cb;font-size:15px;letter-spacing:-.1px}
.bar__m{width:31px;height:31px;border-radius:50%;background:#f1f1f4;flex:none;
        display:grid;place-items:center}
.home{flex:none;height:24px;display:grid;place-items:center}
.home i{width:134px;height:5px;border-radius:3px;background:#0a0a0d;display:block;opacity:.9}

.glass{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:80;
       background:
         linear-gradient(116deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,0) 20%,
            rgba(255,255,255,0) 62%,rgba(60,64,92,.055) 82%,rgba(60,64,92,.11) 100%)}

/* 空歌词 */
.empty{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;
       transition:opacity .7s ease;pointer-events:none;z-index:4}
.empty.on{opacity:1}
.empty__i{width:36px;height:36px;margin:0 auto 13px;border-radius:50%;
          border:1.4px solid #e4e4e9;display:grid;place-items:center}
.empty__t{font-size:13px;color:#b8b8c0;letter-spacing:.4px}

/* ================= 左侧曲目信息 ================= */
.meta{position:fixed;left:7vw;top:50%;transform:translateY(-50%);
      color:#8a8a96;pointer-events:none;opacity:0;transition:opacity 1s ease}
.meta.on{opacity:1}
.meta__k{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600;
         letter-spacing:2.2px;color:#5a5a66;margin-bottom:16px}
.meta__dot{width:5px;height:5px;border-radius:50%;background:rgb(var(--ac));flex:none;
           box-shadow:0 0 8px 1px rgba(var(--ac),.7)}
.meta__n{font-size:clamp(19px,1.35vw,23px);font-weight:600;color:#ededf2;letter-spacing:-.4px;
         line-height:1.32;max-width:min(30vw,330px);margin-bottom:9px}
.meta__a{font-size:12.5px;color:#84848f;letter-spacing:.35px;
         max-width:min(30vw,330px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta__p{width:min(19vw,240px);height:1.5px;background:rgba(255,255,255,.10);margin-top:22px;
         position:relative;overflow:hidden;border-radius:1px}
.meta__p i{position:absolute;left:0;top:0;height:100%;width:100%;background:#cfcfda;border-radius:1px;
           transform:scaleX(0);transform-origin:left center;transition:transform .28s linear}
.meta__t{margin-top:10px;font-size:10px;letter-spacing:1px;color:#5e5e6a;
         font-variant-numeric:tabular-nums;display:flex;gap:9px}
.meta__t b{font-weight:500;color:#9a9aa6}

/* ================= 适配 ================= */
@media (max-width:1100px){
  .meta{left:5vw}
  .meta__n{font-size:17px}
}
@media (max-aspect-ratio: 9/10){
  .anchor{left:50%;top:50%;perspective:none}
  .halo{display:none}
  .tilt{transform:none;transition:none}
  .float{animation:none}
  .box{transform:scale(calc(var(--k,1)*0.5))}
  .layers{display:none}
  .phone{border-radius:44px;box-shadow:none}
  .screen{inset:5px;border-radius:40px}
  .meta{display:none}
  .glass{display:none}
}

/* ================= 横屏：手机横放放大 ================= */
/* 机身换向为 844×390 贴满横屏，屏幕内容按横屏 iMessage 重排——状态栏在上、
   导航与会话头同一行、气泡左右交替、语音条 + 输入框在底。竖屏走上面
   @media (max-aspect-ratio: 9/10) 那套；.ls 由 fit() 按 W/H < 0.9 挂/摘，
   横屏挂、竖屏摘。
   左边歌词列避开真灵动岛：岛从左缘伸进约 36pt，气泡左缘落在岛右缘之外
   再空约 18pt——合计 54pt 除以缩放 k 得设计 px，fit() 写进 --islandPad；
   左气泡与「正在输入」都按它左对齐，语音条/输入框/导航不动。 */
.ls .anchor{left:50%;top:50%}
.ls .halo{display:none}
.ls .tilt{transform:none}
.ls .float{animation:none}
.ls .layers{display:none}
.ls .meta{display:none}
.ls .glass{display:none}
.ls .phone{width:844px;height:390px;border-radius:44px;box-shadow:none}
.ls .screen{inset:5px;border-radius:38px;display:grid;
  grid-template-columns:1fr auto 1fr;
  grid-template-rows:auto auto 1fr auto auto}
/* 状态栏：整行置顶，内容已删，只留 34px 空行 */
.ls .sbar{grid-column:1 / -1;grid-row:1;height:34px;padding:0 20px}
/* 导航在左列，会话头在中列（1fr auto 1fr，中列居中） */
.ls .nav{grid-column:1;grid-row:2;align-self:center;height:40px}
.ls .nav__n{font-size:14px}
/* 会话头 3 行（歌名/歌手/正在播放），头像跨 3 行；竖屏的负边距与
   歌名 margin-top 在此抵消；头像与导航文字同 grid row 居中，本来就平齐 */
.ls .hd{grid-column:2;grid-row:2;display:grid;margin-top:0;
  grid-template-columns:auto auto;grid-template-rows:auto auto auto;
  align-items:center;column-gap:10px;padding:0}
.ls .hd__av{grid-column:1;grid-row:1 / span 3;width:40px;height:40px;flex:none}
.ls .hd__av b{font-size:15px}
.ls .hd__n{grid-column:2;grid-row:1;font-size:17px;max-width:420px;text-align:left;margin-top:0}
.ls .hd__a{grid-column:2;grid-row:2;font-size:12px;color:#6e6e76;text-align:left;max-width:420px}
.ls .hd__s{grid-column:2;grid-row:3;font-size:11px;text-align:left}
/* 左边歌词列避岛：左缘 = --islandPad（设计 px，fit() 按 54pt/k 算），
   再减 5px 屏幕内边距；「正在输入」同列，一起挪 */
.ls .bub.l{left:calc(var(--islandPad,48px) - 5px)}
.ls .typing.l{left:calc(var(--islandPad,48px) - 5px)}
/* 对话区占满中段；语音条 + 输入框各占底下一行；home 条横屏不要 */
.ls .chat{grid-column:1 / -1;grid-row:3}
.ls .rec{grid-column:1 / -1;grid-row:4;padding:2px 12px 6px}
.ls .bar{grid-column:1 / -1;grid-row:5;height:44px;padding:0 12px 4px}
.ls .bar__in{height:29px}
.ls .bar__p,.ls .bar__m{width:28px;height:28px}
.ls .home{display:none}

@media (prefers-reduced-motion: reduce){
  .phone{animation:none}
  .rec__w i{transition:none}
  .typing i{animation:none;opacity:.6}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="glow" id="glow"></div>
<canvas id="grain"></canvas>

<div class="stage">
  <div class="anchor" id="anchor">
    <div class="halo"></div>
    <div class="tilt" id="tilt">
    <div class="par" id="par">
    <div class="float">
    <div class="box" id="box">
      <div class="layers" id="layers"></div>
      <div class="phone" id="phone">

      <div class="screen">

        <!-- 状态栏：时间/信号/WiFi/电量已删，只留 54px 空占位 -->
        <div class="sbar"></div>

        <!-- 导航：返回箭头已删，只留名字 -->
        <div class="nav">
          <div class="nav__n" id="navN">—</div>
        </div>

        <!-- 会话头：头像上移与导航文字平齐；歌名下加歌手行 -->
        <div class="hd">
          <div class="hd__av" id="av"><b id="avCh">♪</b><img id="avImg" alt=""></div>
          <div class="hd__n" id="hdN">—</div>
          <div class="hd__a" id="hdA">—</div>
          <div class="hd__s">正在播放</div>
        </div>

        <!-- 对话 -->
        <div class="chat" id="chat">
          <div class="stamp" id="stamp">今天</div>
          <div class="thread" id="thread">
            <div class="typing l" id="typing"><i></i><i></i><i></i></div>
          </div>
          <div class="empty" id="empty">
            <div class="empty__i">
              <svg width="15" height="11" viewBox="0 0 15 11" fill="#d6d6dc"><path d="M1.2 1h12.6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4.8L2 11V9H1.2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1Z"/></svg>
            </div>

        <!-- 输入条：iMessage 占位字已删，留空框 -->
        <div class="bar">
          <div class="bar__p">+</div>
          <div class="bar__in"></div>
          <div class="bar__m">
            <svg width="14" height="18" viewBox="0 0 14 18" fill="none"><rect x="4.6" y="1" width="4.8" height="9.4" rx="2.4" stroke="#8a8a90" stroke-width="1.5"/><path d="M1.6 8.2a5.4 5.4 0 0 0 10.8 0" stroke="#8a8a90" stroke-width="1.5" stroke-linecap="round"/><path d="M7 13.9V16.6" stroke="#8a8a90" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>

</div>

</div>

<div class="meta" id="meta">
  <div class="meta__k"><span class="meta__dot"></span>NOW PLAYING</div>
  <div class="meta__n" id="mN">—</div>
  <div class="meta__a" id="mA">—</div>
  <div class="meta__p"><i id="mBar"></i></div>
  <div class="meta__t"><b id="mCur">0:00</b><span>/</span><span id="mDur">0:00</span></div>

<script>
(function(){
"use strict";

/* 可选背景：DOM 形态走挂载层。背景层插在 .bg 之后，.glow/#grain/.stage 仍在它上面；
   选自定义并加载成功后模块才隐藏原生 .bg，失败则原生背景照常显示。 */
if (window.LIZI_BG) {
  try { LIZI_BG.mountDOM(document.body, document.querySelector(".bg")); } catch (e) {}
}

/* ==========================================================
   1) 自检口 —— 最外层、无条件、直接算
   ========================================================== */
var S = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: "" };
var RM = false;
try { RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch(e){}

window.__stage = function(){
  var i = S.idx;
  return {
    lines:   S.lines.length,
    idx:     i,
    t:       S.t,
    playing: S.playing,
    frames:  S.frames,
    js:      Math.round(S.js * 100) / 100,
    err:     S.err,
    text:    (i >= 0 && S.lines[i] && S.lines[i].text) ? String(S.lines[i].text) : "",
    gl:      false,
    rm:      RM
  };
};

var lastErrAt = 0;
function fail(e){
  try { S.err = String((e && e.message) || e); } catch(_){ S.err = 'error'; }
  var n = performance.now();
  if (n - lastErrAt > 1000){ lastErrAt = n; try { console.error(e); } catch(_){} }
}

/* ==========================================================
   1.5) 设置面板（宿主画 UI，这里只声明）
   ========================================================== */
/* r55：运镜已删，镜头/固定机位/换镜频率三项随之作废——设置面板只剩
   左侧歌曲信息开关。自由视角不用开，直接拖手机就行（见第 10 节）。 */
window.__stagePanel = {
  title: '已发送',
  hint: '横屏时直接拖手机可以换个角度看，滚轮缩放；点下面语音条可以暂停/继续播。',
  items: [
    { key:'meta',  label:'左侧歌曲信息', type:'switch', def:false }
  ]
};

/* meta 默认 false 与 __stagePanel 的 def 保持一致：首次进形态不显示左侧曲目信息 */
var P = { meta:false };

/* ==========================================================
   2) ready —— 第一个 rAF 无条件发，全局只发一次
   ========================================================== */
var readySent = false;
function sendReady(){
  if (readySent) return;
  readySent = true;
  try { parent.postMessage({ __c100:1, type:"ready" }, "*"); } catch(e){ console.error(e); }
}
requestAnimationFrame(sendReady);
setTimeout(sendReady, 800);

/* ==========================================================
   3) 工具
   ========================================================== */
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function mmss(s){
  if (!isFinite(s) || s < 0) s = 0;
  return Math.floor(s/60) + ':' + pad2(Math.floor(s%60));
}
function toRGB(a){
  if (!Array.isArray(a) || a.length < 3) return null;
  var r = Math.round(Number(a[0])), g = Math.round(Number(a[1])), b = Math.round(Number(a[2]));
  if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return null;
  r = clamp(r,0,255)|0; g = clamp(g,0,255)|0; b = clamp(b,0,255)|0;
  if (r + g + b < 26) return null;
  return [r,g,b];
}

/* ==========================================================
   4) DOM
   ========================================================== */
var root    = document.documentElement;
var anchor  = $('anchor'), phone = $('phone');
var chat    = $('chat'), thread = $('thread'), stamp = $('stamp'), typing = $('typing');
var emptyEl = $('empty');
var avImg = $('avImg'), avCh = $('avCh');
var recEl = $('rec'), recB = $('recB');
var recWave = $('recWave'), recT = $('recT');
var glow    = $('glow'), metaEl = $('meta');
var mBar    = $('mBar'), mCur = $('mCur'), mDur = $('mDur');
var tiltEl  = $('tilt');

/* ==========================================================
   5) 尺寸
   ========================================================== */
var CW = 350, CH = 470, TW = 272, GAP = 9;
var songDur = 0;
var K = 1;              /* 基础缩放（fit 里算） */
var PORTRAIT = false;

function fit(){
  var W = innerWidth || 1440, H = innerHeight || 900;
  if (!isFinite(W) || W <= 0) W = 1440;
  if (!isFinite(H) || H <= 0) H = 900;

  var portrait = (W / H) < 0.9;
  PORTRAIT = portrait;
  var k;
  if (portrait){
    /* 竖屏：手机竖放满屏，k 按 390×844 算；摘掉横屏布局类。 */
    root.classList.remove('ls');
    k = Math.min(W / 390, H / 844);
    root.style.setProperty('--k', String(k));
    K = k;
  } else {
    /* 横屏：手机横过来放大贴满横屏——机身换向为 844×390（宽/高对调），
       k 按换向后的尺寸重算：874×402 下 k≈1.03，手机 870×402 贴满；
       SE 横屏 667×375 下 k≈0.79，手机 667×308 贴满宽（高 82%，机身
       宽高比 2.16 比视口 1.78 宽，贴满高就得裁掉气泡两侧，宁可上下
       留黑边也不裁内容）；桌面大屏仍封顶 1.26。
       左边歌词列避岛：岛从左缘伸进约 36pt，气泡左缘落在岛右缘之外
       再空约 18pt——合计 54pt 除以 k 得设计 px，写进 --islandPad，
       .ls .bub.l / .ls .typing.l 按它左对齐（再减 5px 屏幕内边距）。
       17 Pro Max 横屏 956×440：k≈1.13，左缘≈48 设计 px；
       iPhone 17 横屏 874×402：k≈1.03，左缘≈52 设计 px。 */
    root.classList.add('ls');
    k = Math.min(W / 844, H / 390, 1.26);
    root.style.setProperty('--k', String(k));
    root.style.setProperty('--islandPad', (54 / k).toFixed(1) + 'px');
    K = k;
    anchor.style.left = '50%';
  }
  buildLayers();   /* 机身挤层随 K 重建（安卓按实际缩放自适应层距） */

  var cw = chat.clientWidth || 350;
  var ch = chat.clientHeight || 470;
  var changed = (cw !== CW || ch !== CH);
  CW = cw; CH = ch;
  TW = Math.max(120, Math.round((CW - 24) * 0.76));
  root.style.setProperty('--bw', TW + 'px');
  if (changed) layout();

  /* 转屏丢词修法 1：转屏后强制全量重画，不依赖 frame() 的换句
     检测——layout() 重算 offs/hgt、重定位气泡、重锚线程，
     repaintCurrent() 再全量重画。只在横屏做：竖屏手机满屏，气泡一定可见。 */
  if (changed && !portrait) repaintCurrent();
}

/* ==========================================================
   6) 噪点
   ========================================================== */
(function(){
  try {
    var c = $('grain'), g = c.getContext('2d');
    var w = innerWidth || 0, h = innerHeight || 0;
    var d = Math.min(window.devicePixelRatio || 1, 2);
    if (w <= 0 || h <= 0 || !isFinite(d) || d <= 0) return;
    c.width = Math.round(w * d); c.height = Math.round(h * d);
    var img = g.createImageData(c.width, c.height), dt = img.data;
    for (var i = 0; i < dt.length; i += 4){
      var v = (Math.random() * 255) | 0;
      dt[i] = v; dt[i+1] = v; dt[i+2] = v; dt[i+3] = 15;
    }
    g.putImageData(img, 0, 0);
  } catch(e){ fail(e); }
})();

/* ==========================================================
   7) 歌词布局（行时间 → 字符宽度 → 气泡高度；不依赖任何运镜）
   ========================================================== */
function lineTimes(){
  if (!S.lines.length) return [];
  var out = new Array(S.lines.length), st = 0;
  for (var i = 0; i < S.lines.length; i++){
    var L = S.lines[i];
    var t = (typeof L.t === 'number' && isFinite(L.t)) ? L.t : st;
    var d = (typeof L.dur === 'number' && isFinite(L.dur) && L.dur > 0) ? L.dur : 1.5;
    out[i] = t;
    if (L.text && !/^\s*$/.test(L.text) && i < S.lines.length - 1){
      var txt = String(L.text);
      var base = Math.max(0.5, d);
      out[i] = Math.max(0, t - Math.min(0.5, base * 0.35) + (txt.length <= 8 ? -0.9 : 0));
    }
    st = t + d;
  }
  return out;
}
function idxAt(t){
  var T = lineTimes(), i = -1;
  for (var j = 0; j < T.length; j++){ if (T[j] <= t + 1e-6) i = j; else break; }
  if (i < 0 && T.length) i = 0;
  return i;
}
function charW(ch){
  if (!ch) return 0;
  /* 原生发的是 {c: 字, t: 秒}，不是 {text}——读错字段估宽全 0，
     每行都按单行 38 算，offs 会错位。 */
  var txt = (typeof ch === 'string') ? ch : (ch.c || ch.text);
  if (!txt) return 0;
  var c = txt.charCodeAt(0), w = ch.width;
  if (typeof w === 'number' && isFinite(w) && w > 0) return Math.min(34, w);
  if (c >= 0x1100 && c <= 0xD7FF) return 16;
  if (c > 0xFF) return 16;
  return 7.6;
}
function estH(L){
  var W = TW - 30;
  if (!L || !L.text) return 38;
  var chars = Array.isArray(L.chars) && L.chars.length ? L.chars : null;
  var total = 0;
  if (chars){ for (var i = 0; i < chars.length; i++) total += charW(chars[i]); }
  else { total = String(L.text).length * 15.4; }
  return Math.max(38, Math.ceil(total / Math.max(30, W)) * 22 + 16);
}

var bubbles = [];   /* index → .bub */
var offs = [], hgt = []; /* 每行气泡顶偏移 / 估高（layout() 按当前 TW 重算） */
var curIdx = -2, songKey = '', metaShown = false, metaKey = '';

function clearBubbles(){
  try {
    var b = thread.querySelectorAll('.bub');
    for (var i = 0; i < b.length; i++) b[i].remove();
  } catch(e){}
  bubbles = [];
}

/* r56 闪的修法：恢复 r54 的距离淡出（r55 重写误删）。
   闪的机制：r55 里所有气泡都以满不透明度 1 往上滚，线程每换一句只跳
   一次、一步约 48px，而顶区白渐隐（.chat::before）只有 54px 高——
   一个气泡一跳就从全清变全白，蓝气泡 #0b84ff→白、黑字→白，亮度一跳
   到顶，肉眼就是「滚到上面白色区域时会闪」。r54 的 fadeFor 把淡出摊
   到约 6 句（每远一句暗 0.10、底 0.44），气泡到顶区时已经半淡，白渐隐
   只是再推一把，没有一跳变白的闪。只动不透明度这一条链：位置/尺寸/
   逐字点亮/滚动模型一字不动。 */
function fadeFor(j){
  if (curIdx < 0) return 1;
  return clamp(1 - Math.abs(j - curIdx) * 0.10, 0.44, 1);
}

function makeBubble(i){
  var L = S.lines[i];
  if (!L) return null;
  var el = document.createElement('div');
  el.className = 'bub ' + ((i % 2 === 0) ? 'r' : 'l');
  /* 气泡是绝对定位，必须写 top（旧文件同一路），否则全叠在线程顶部。
     字从行文本取（原生 chars 是 {c, t}，没有 text 字段），时间走 charTimes。 */
  el.style.top = (offs[i] || 0) + 'px';
  var chars = Array.from(String(L.text || ''));
  var times = charTimes(L);
  var spans = [];
  for (var j = 0; j < chars.length; j++){
    var sp = document.createElement('span');
    sp.textContent = chars[j] === ' ' ? '\u00A0' : chars[j];
    el.appendChild(sp);
    var on = (times[j] != null && S.t >= times[j]);
    if (on) sp.className = 'on';
    spans.push({ el: sp, t: times[j], on: on });
  }
  el._spans = spans;
  el.style.transform = 'translateY(10px)';
  el.style.opacity = '0';
  /* 入场目标不是 1，是按离当前句距离算的 fadeFor（r54 同一路）：刚发的
     下一句 0.9、越往上越暗，最暗 0.44；.bub 的 opacity .55s 过渡接着带。 */
  var target = fadeFor(i);
  thread.appendChild(el);
  requestAnimationFrame(function(){
    el.style.opacity = String(target); el.style.transform = 'translateY(0)';
  });
  return el;
}

/* 每字点亮时间（旧文件 lineTimes(line) 同一语义）：有逐字时间就用它
   （首字时间小于行首 0.08 以上视为相对时间，加行首）；没有就按行 dur
   在行内均匀摊。无参 lineTimes() 是另一函数（行首时间表），别混。 */
function charTimes(line){
  var arr = Array.from(String(line.text || '')), n = arr.length, out = [], i;
  var cs = line.chars;
  if (cs && cs.length){
    var c0 = cs[0];
    var rel = !!(c0 && isFinite(Number(c0.t)) && Number(c0.t) < line.t - 0.08);
    for (i = 0; i < n; i++){
      var j = cs.length === n ? i : Math.min(cs.length - 1, Math.floor(i * cs.length / n));
      var rec = cs[j];
      var ct = (rec && typeof rec === 'object') ? Number(rec.t) : NaN;
      out.push(isFinite(ct) ? (rel ? line.t + ct : ct) : null);
    }
    return out;
  }
  var d = line.dur > 0 ? line.dur : 3.4;
  for (i = 0; i < n; i++) out.push(line.t + d * 0.9 * i / Math.max(1, n));
  return out;
}

/* 逐字点亮：每帧按 S.t 刷当前句的字（旧文件 reveal 同一路）。 */
function reveal(b, t){
  if (!b || !b._spans) return;
  var sp = b._spans;
  for (var k = 0; k < sp.length; k++){
    var on = sp[k].t != null && t >= sp[k].t;
    if (on !== sp[k].on){
      sp[k].on = on;
      sp[k].el.className = on ? 'on' : '';
    }
  }
}

function windowRange(i){
  var total = S.lines.length;
  var before = 8, after = 1;
  var start = Math.max(0, i - before);
  var end = Math.min(total - 1, i + after);
  return { start: start, end: end };
}

function paintWindow(i){
  if (!S.lines.length) return;
  var w = windowRange(i);
  for (var j = w.start; j <= w.end; j++){
    if (!bubbles[j]){
      var b = makeBubble(j);
      if (b) bubbles[j] = b;
    }
  }
  for (var j2 = 0; j2 < bubbles.length; j2++){
    var b2 = bubbles[j2];
    if (b2 && (j2 < w.start || j2 > w.end)) { b2.remove(); bubbles[j2] = null; }
  }
}

/* iMessage 风：最底部的气泡在对齐时间戳上方；
   歌词滚动带 1 句提前量（current 行上移时它在 viewport 中间偏上），
   对齐点取当前气泡顶离 chat 顶的距离——与 chat 内部坐标系一致，
   layout() 的高度差不依赖它。 */
function layout(){
  if (!S.lines.length){
    thread.style.transform = '';
    return;
  }
  /* 逐行累计 top：首句从 30 起（时间戳占 10–24px，气泡紧跟时间戳），
     与 旧文件同一套 offs/hgt 模型。TW 随转屏变，offs 每次重算；
     已有气泡按新 offs 重定位，免得转屏后 top 错位。 */
  offs = []; hgt = [];
  var y = 30;
  for (var j = 0; j < S.lines.length; j++){
    var h = estH(S.lines[j]);
    hgt.push(h);
    offs.push(y);
    y += h + GAP;
  }
  var w = windowRange(curIdx < 0 ? 0 : curIdx);
  for (var j2 = w.start; j2 <= w.end; j2++){
    if (!bubbles[j2]){
      var b = makeBubble(j2);
      if (b) bubbles[j2] = b;
    }
  }
  for (var j3 = 0; j3 < bubbles.length; j3++){
    if (bubbles[j3]) bubbles[j3].style.top = (offs[j3] || 0) + 'px';
  }
  applyThreadTY();
}

/* 当前句锚到底部（旧文件同一公式）：句少时 ty=0 从顶排，句多时上滚、
   当前句底钉在对话区底 12px、气泡排满到语音条。 */
function applyThreadTY(){
  var i = curIdx;
  var h = (i >= 0 && hgt[i]) ? hgt[i] : 0;
  var ty = Math.min(0, CH - 12 - h - (i >= 0 ? (offs[i] || 0) : 0));
  thread.style.transform = 'translateY(' + Math.round(ty) + 'px)';
  var t2 = document.getElementById('thread');
  if (t2) t2.dataset.ty = String(Math.round(ty));
}

function ensureBubble(i){
  var w = windowRange(i);
  for (var j = w.start; j <= w.end; j++){
    if (!bubbles[j]){
      var b = makeBubble(j);
      if (b) bubbles[j] = b;
    }
  }
  for (var j2 = 0; j2 < bubbles.length; j2++){
    var b2 = bubbles[j2];
    if (b2 && (j2 < w.start || j2 > w.end)) { b2.remove(); bubbles[j2] = null; }
  }
}

function restyle(i){
  for (var j = 0; j < bubbles.length; j++){
    var b = bubbles[j];
    if (b) {
      b.classList.toggle('cur', j === i);
      /* 每换一句，全窗气泡按新距离重算不透明度（.bub 的 opacity .55s
         过渡接着带，逐句暗 0.10）；当前句恒为 1，不动逐字点亮。 */
      b.style.opacity = String(fadeFor(j));
    }
  }
}

function setIdx(i){
  if (i === curIdx) return;
  curIdx = i;
  S.idx = i;
  /* layout() 先算 offs（makeBubble 的 top 依赖它），再补/裁窗口气泡。 */
  layout();
  ensureBubble(i);
  paintWindow(i);
  restyle(i);
}

function repaintCurrent(){
  layout();
  restyle(curIdx);
}

/* ==========================================================
   8) 正在输入…（打字指示）
   ========================================================== */
function updateTyping(cur){
  var show = !!(S.lines.length && cur >= 0 && cur < S.lines.length);
  if (show && cur >= 0 && cur < S.lines.length){
    var want = (cur % 2 === 0) ? 'r' : 'l';
    typing.classList.toggle('r', want === 'r');
    typing.classList.toggle('l', want === 'l');
    /* 打字指示落在下一句的位置（没有下一句就落在当前句下方）。 */
    var nxt = (cur + 1 < offs.length) ? offs[cur + 1] : ((offs[cur] || 0) + (hgt[cur] || 0) + GAP);
    typing.style.top = nxt + 'px';
  }
  typing.classList.toggle('on', show);
}

/* ==========================================================
   9) 时间戳（实时中国大陆时间，Asia/Shanghai）
   ========================================================== */
var lastStamp = '';
function tickClock(){
  var d = new Date();
  var t;
  try {
    t = new Intl.DateTimeFormat('zh-CN', { timeZone:'Asia/Shanghai', hour:'numeric', minute:'2-digit', hour12:false }).format(d);
  } catch(e){
    var u = d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000;
    var dd = new Date(u);
    t = dd.getHours() + ':' + pad2(dd.getMinutes());
  }
  var s = '今天 ' + t;
  if (s !== lastStamp){
    lastStamp = s;
    stamp.textContent = s;
  }
}
setInterval(tickClock, 1000);
tickClock();

/* ==========================================================
   10) 自由视角（横屏）：直接拖手机换个角度看，滚轮缩放。
   r55：运镜已删——没有镜头预设、没有自动/固定镜头、没有换镜频率，
   这里只有用户亲手拖的那点角度。手机平时永远平放（transform:none），
   用户拖动后才有角度；切歌时如果用户没拖过（freeUsed=false），
   手机回到平放；用户拖过就保持他留下的角度不动。
   拖动起点排除 .rec 与 .bar，免得点语音条/输入框被拖动吞掉。
   竖屏不允许拖（PORTRAIT 时直接返回）。 */
var freeRX = 0, freeRY = 0, freeS = 1, freeUsed = false;
var freeDrag = null;
var metaZoomHide = false;

function freeDepthUpdate(){
  /* 机身厚度随缩放变：放大时层距拉开（金属侧壁变厚），
     缩小时收拢回正常层距（不触 0——不压穿屏幕面）。
     ANDROID（部分机型 GPU 层数受限）降半。 */
  var layers = document.querySelectorAll('#layers i');
  if (!layers.length) return;
  var d = clamp(K * 0.6 * freeS, 0.01, 1);
  if (window.ANDROID) d = d * 0.5;
  for (var i = 0; i < layers.length; i++){
    layers[i].style.transform = 'translateZ(' + (d * (i - layers.length / 2)).toFixed(2) + 'px)';
  }
  /* 层数太多会糊掉一半浏览器（手机上 12 层够用，桌面 30 层）。 */
  var target = (window.ANDROID || PORTRAIT) ? 12 : 30;
  var current = layers.length;
  if (target > current){
    var ref = document.querySelector('#layers i');
    if (ref){
      var computed = getComputedStyle(ref);
      for (var j = current; j < target; j++){
        var el = document.createElement('i');
        el.style.borderRadius = computed.borderRadius;
        $('layers').appendChild(el);
      }
    }
  } else if (target < current){
    for (var k = current - 1; k >= target; k--){
      if (layers[k]) layers[k].remove();
    }
  }
}

function applyFree(){
  /* 平移已删：只剩旋转 + 缩放。 */
  if (!tiltEl) return;
  tiltEl.style.transform =
    'rotateX(' + freeRX.toFixed(2) + 'deg)' +
    ' rotateY(' + freeRY.toFixed(2) + 'deg)' +
    ' scale(' + freeS.toFixed(3) + ')';
  freeDepthUpdate();
  metaZoomHide = (freeS > 1.55);
  syncMeta();
}

addEventListener('pointerdown', function(e){
  if (PORTRAIT) return;
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target && e.target.closest && e.target.closest('.rec,.bar')) return;
  freeDrag = { x: e.clientX, y: e.clientY, rx: freeRX, ry: freeRY };
  freeUsed = true;
  if (tiltEl) tiltEl.style.transitionDuration = '0ms';
});
addEventListener('pointermove', function(e){
  if (!freeDrag) return;
  var dx = e.clientX - freeDrag.x, dy = e.clientY - freeDrag.y;
  freeRY = clamp(freeDrag.ry + dx * 0.22, -62, 62);
  freeRX = clamp(freeDrag.rx - dy * 0.22, -34, 34);
  applyFree();
});
function endFreeDrag(){
  if (!freeDrag) return;
  freeDrag = null;
  if (tiltEl) tiltEl.style.transitionDuration = '';
}
addEventListener('pointerup', endFreeDrag);
addEventListener('pointercancel', endFreeDrag);
addEventListener('blur', endFreeDrag);
addEventListener('wheel', function(e){
  if (PORTRAIT) return;
  if (e.deltaY === 0) return;
  e.preventDefault();
  freeS = clamp(freeS * (e.deltaY < 0 ? 1.07 : 0.93), 0.80, 2.60);
  freeUsed = true;
  applyFree();
}, { passive: false });

/* ==========================================================
   10.5) 语音条：点按暂停/继续播（r55 新功能）
   ========================================================== */
/* 走现成桥：发 key Space → StageBridge 的 'key' 分支调 onSpaceKey?()
   → StageView 接成 playback.togglePlay()。不新增消息类型、不改 Swift。
   图标跟随播放状态：播时双杠（点一下暂停），停时三角（点一下继续播）。
   只做点按切换，不加拖动 seek；拖动起点已在第 10 节排除 .rec。 */
function syncRecIcon(){
  if (!recB) return;
  var paused = !S.playing;
  if (recB.__paused !== paused){
    recB.__paused = paused;
    recB.classList.toggle('paused', paused);
  }
}
if (recEl) recEl.addEventListener('click', function(){
  try { parent.postMessage({ __c100:1, type:'key', payload:{ key:'Space' } }, '*'); } catch(e){ fail(e); }
});

/* ==========================================================
   11) 语音条进度（48 条波形）
   ========================================================== */
var bars = [];
var recProgress = 0;
function mkBars(){
  if (bars.length) return;
  for (var i = 0; i < 48; i++){
    var b = document.createElement('i');
    /* 条是绝对定位、不撑容器：间距 2.5px、容器宽显式写成 48×2.5=120px，
       语音条才有定稿的约 210pt（54%）。只在建条时定一次位，
       不要每帧重写 left。 */
    b.style.left = (i * 2.5 + 0.5).toFixed(1) + 'px';
    recWave.appendChild(b);
    bars.push(b);
  }
  recWave.style.width = (48 * 2.5) + 'px';
  recWave.style.minWidth = (48 * 2.5) + 'px';
}
function setBars(){
  var n = bars.length;
  if (!n) return;
  for (var i = 0; i < n; i++){
    var x = i / n;
    var y = Math.pow(Math.sin(x * Math.PI * 2.7) * 0.5 + 0.5, 1.7) * 0.42 + 0.1 +
            Math.sin(i * 1.7) * 0.1 + Math.sin(i * 0.53) * 0.07;
    y = clamp(y, 0.1, 1);
    bars[i].style.transform = 'scaleY(' + y.toFixed(2) + ')';
    bars[i].classList.toggle('ps', i / n <= recProgress);
  }
}
function setRecProgress(){
  if (songDur > 0) recProgress = clamp(S.t / songDur, 0, 1);
  else recProgress = 0;
  var t = mmss(S.t);
  if (recT.textContent !== t) recT.textContent = t;
  setBars();
}

/* ==========================================================
   12) 曲目信息 / 封面 / 左侧 meta
   ========================================================== */
function setAccent(ac){
  var rgb = toRGB(ac);
  if (!rgb) return;
  root.style.setProperty('--ac', rgb[0] + ',' + rgb[1] + ',' + rgb[2]);
}

function syncMeta(){
  var show = P.meta && !PORTRAIT && !metaZoomHide;
  metaEl.classList.toggle('on', show);
}

/* r56：无封面显示歌名首字（去空格取第一个字；歌名也没有才留 ♪）。
   Swift 侧现在发 data: URI（有封面）或 ""（无封面），不再发 http(s) URL。 */
function setArt(cover, title){
  var img = $('avImg');
  if (!img) return;
  if (cover && typeof cover === 'string' && cover.indexOf('data:') === 0){
    var ch = avCh;
    if (img.src !== cover) img.src = cover;
    img.style.display = 'block';
    if (ch) ch.style.display = 'none';
  } else {
    img.style.display = 'none';
    img.removeAttribute('src');
    var ch2 = avCh;
    if (ch2) {
      ch2.style.display = '';
      var t = String(title || '').replace(/^\s+/, '');
      var first = t ? t.charAt(0) : '';
      ch2.textContent = (first && first !== '—') ? first : '♪';
    }
  }
}

/* ==========================================================
   13) 消息
   ========================================================== */
function onInit(p){
  try {
    if (!p) p = {};
    var song = p.song || {};
    var title = String(song.name || '—');
    var artist = Array.isArray(song.artists) ? song.artists.join(' / ') : String(song.artists || song.artist || '—');
    var navName = String(song.name || '—');
    $('navN').textContent = navName;
    $('hdN').textContent = title;
    $('hdA').textContent = artist;
    $('mN').textContent = title;
    $('mA').textContent = artist;
    var dur = (typeof p.duration === 'number' && isFinite(p.duration) && p.duration > 0) ? p.duration : 0;
    songDur = dur;
    mDur.textContent = mmss(songDur);
    mCur.textContent = mmss(0);

    var k = (title + '|' + artist + '|' + String(song.cover || '') + '|' + String(p.accent || ''));
    if (k !== songKey){
      songKey = k;
      S.lines = Array.isArray(p.lines) ? p.lines : [];
      S.idx = -1;
      curIdx = -2;
      clearBubbles();
      S.t = 0;
      S.playing = (p.playing !== false);
      S.frames = 0;
      S.js = 0;
      S.err = '';
      setAccent(p.accent);
      setArt(song.cover, title);
      if (S.lines.length) emptyEl.classList.remove('on');
      else emptyEl.classList.add('on');
      fit();
      layout();
      var i = idxAt(0);
      setIdx(i);
      if (i >= 0) updateTyping(i);
    }
    if (S.lines.length) emptyEl.classList.remove('on');
    else emptyEl.classList.add('on');
    /* 切歌时如果用户没拖过，手机回到平放；拖过就保持他留下的角度。 */
    if (!freeUsed && tiltEl) tiltEl.style.transform = '';
    syncRecIcon();
    syncMeta();
  } catch(e){ fail(e); }
}

function onLive(t){
  try {
    if (typeof t === 'number' && isFinite(t)) S.t = t;
  } catch(e){ fail(e); }
}

function onBeat(playing){
  /* 原生 beat 只带 {index, level}、没有 playing——没给就不碰 S.playing，
     否则每行一切换都会把暂停状态强行掰回播放。 */
  if (typeof playing === 'boolean') S.playing = playing;
  syncRecIcon();
}

function onSetting(key, value){
  if (key === 'meta'){ P.meta = (value === true); syncMeta(); }
}

/* ==========================================================
   14) 总线（出：ready/activity/key；进：init/tick/beat/live/setting）
   ========================================================== */
addEventListener('message', function(e){
  try {
    var d = e.data;
    if (!d || d.__c100 !== 1) return;
    var p = d.payload || {};
    if (d.type === 'init'){ onInit(p); }
    else if (d.type === 'tick'){
      /* 原生 66ms tick：payload {time, playing}——歌词时间与播放状态全走
         这里。r55 重写初版误读成顶层 d.js，S.t 永远不进、歌词卡首句；
         按 StageBridge 实发形态修回（与 旧文件同一路）。 */
      var t = Number(p.time);
      if (isFinite(t)) S.t = t;
      if (typeof p.playing === 'boolean') S.playing = p.playing;
      S.js = (typeof d.js === 'number') ? d.js : S.js;
    }
    else if (d.type === 'beat'){ onBeat(p.playing); }
    else if (d.type === 'live'){ onLive(p.t); }
    else if (d.type === 'setting'){ onSetting(p.key, p.value); }
  } catch(err){ fail(err); }
});

/* ==========================================================
   15) 鼠标视差（只桌面有鼠标时生效；与运镜无关，保留）
   ========================================================== */
(function(){
  try {
    var par = $('par');
    if (!par) return;
    var raf = null, tx = 0, ty = 0, cx = 0, cy = 0;
    addEventListener('mousemove', function(e){
      if (PORTRAIT) return;
      tx = (e.clientX / (innerWidth || 1) - 0.5) * 2;
      ty = (e.clientY / (innerHeight || 1) - 0.5) * 2;
      if (!raf){
        raf = requestAnimationFrame(function loop(){
          cx += (tx - cx) * 0.09;
          cy += (ty - cy) * 0.09;
          par.style.transform =
            'rotateX(' + (-cy * 5.4).toFixed(2) + 'deg)' +
            ' rotateY(' + (cx * 3.6).toFixed(2) + 'deg)';
          if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
            raf = requestAnimationFrame(loop);
          } else {
            raf = null;
          }
        });
      }
    });
  } catch(e){ fail(e); }
})();

/* ==========================================================
   16) 键盘 Space：暂停/继续（与 .rec 点按同一条路）
   ========================================================== */
addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.key === ' '){
    e.preventDefault();
    try { parent.postMessage({ __c100:1, type:'key', payload:{ key:'Space' } }, '*'); } catch(err){ fail(err); }
  }
});

/* ==========================================================
   17) 帧循环
   ========================================================== */
function frame(now){
  try {
    S.frames++;
    var cur = idxAt(S.t);
    if (cur !== S.idx) setIdx(cur);
    updateTyping(cur);
    var cb = bubbles[cur];
    if (cb) reveal(cb, S.t);
    setRecProgress();
    syncRecIcon();
    if (P.meta && !PORTRAIT){
      mCur.textContent = mmss(S.t);
      if (songDur > 0) mBar.style.transform = 'scaleX(' + clamp(S.t / songDur, 0, 1) + ')';
    }
    if (window.ANDROID && !PORTRAIT) freeDepthUpdate();
  } catch(e){ fail(e); }
  requestAnimationFrame(frame);
}

/* ==========================================================
   18) 机身挤层（buildLayers）——随 K 自适应层距
   ========================================================== */
function buildLayers(){
  try {
    var layersEl = $('layers');
    if (!layersEl) return;
    var target = PORTRAIT ? 12 : 30;
    var current = layersEl.children.length;
    if (target > current){
      var ref = layersEl.querySelector('i');
      var radius = '112px';
      if (ref){
        var computed = getComputedStyle(ref);
        radius = computed.borderRadius || radius;
      }
      for (var j = current; j < target; j++){
        var el = document.createElement('i');
        el.style.borderRadius = radius;
        layersEl.appendChild(el);
      }
    } else if (target < current){
      for (var k = current - 1; k >= target; k--){
        if (layersEl.children[k]) layersEl.children[k].remove();
      }
    }
    /* r55：自由视角默认就是横屏——机身层距按当前 K 算，不再等 mode 切换。 */
    if (!PORTRAIT) freeDepthUpdate();
  } catch(e){ fail(e); }
}

/* ==========================================================
   19) 转屏自检（停稳后一次性自检；不做运镜重算）
   ========================================================== */
function rotationSelfCheck(){
  try {
    if (PORTRAIT) return;
    /* 转屏后 chat 尺寸已定：fit() 里已经 layout()+repaintCurrent()，
       这里只做一次兜底自检——当前句气泡在窗口里且可见即可；
       不可见时再重画一次，不碰 transform。 */
    var cur = S.idx;
    if (cur < 0) return;
    var b = bubbles[cur];
    if (!b) { ensureBubble(cur); repaintCurrent(); return; }
    var r = b.getBoundingClientRect();
    var cr = chat.getBoundingClientRect();
    if (r.bottom < cr.top + 4 || r.top > cr.bottom - 4){
      ensureBubble(cur);
      repaintCurrent();
    }
  } catch(e){ fail(e); }
}

/* ==========================================================
   20) 启动
   ========================================================== */
mkBars();
fit();
var resizeTimer = null;
var rotateCheckTimer = null;
addEventListener('resize', function(){
  fit();
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    fit();
    if (rotateCheckTimer) clearTimeout(rotateCheckTimer);
    rotateCheckTimer = setTimeout(function(){
      rotationSelfCheck();
    }, 100);   /* 停稳 200ms + 100ms = 转屏停稳 300ms 后查 */
  }, 200);
});
addEventListener('load', function(){ fit(); });
requestAnimationFrame(frame);

})();
</script>
</body>
