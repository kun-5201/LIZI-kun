<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>商籁 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   商籁（F01 · Folia sonnet）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 sonnet（商籁）模式——
   日式 MG 歌词 PV 导演：海报式边框与角标、按句切分的定格镜头流、动感图形
   随拍点撕裂/辉光。本文件只学形态与流程，按 Lizi 舞台承载协议（__c100）
   独立重写，未复制 Folia 源码；不依赖 React / Pixi / three.js。
   形态：外框 + 角标的海报式构图；每句一切镜头（居中 / 左置 / 分栏三机位
   轮换）；当前句逐字弹出、拍点时镜头微震并闪一道撕裂光。
   播放联动：init 换歌重排；tick 推时间；beat（行变时 level 1）触发震动与闪光。
   ========================================================================== */
const S = { camera: 1, motion: 1, frame: 'frame' };
window.__stagePanel = {
  title: '商籁 · Folia',
  hint: 'MG 歌词 PV：海报外框 + 每句一切镜头的定格镜头流，拍点撕裂闪光。',
  items: [
    { key: 'camera', label: '镜头幅度', type: 'range', min: 0, max: 3, step: 0.1, def: 1 },
    { key: 'motion', label: '动感幅度', type: 'range', min: 0, max: 3, step: 0.1, def: 1 },
    { key: 'frame', label: '海报外框', type: 'segment', def: 'frame', options: [
      { v: 'none', t: '无' }, { v: 'frame', t: '细框' }, { v: 'full', t: '满版' } ] },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let beatPulse = 0, curIdx = -1, shot = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function drawFrame(t) {
  const m = Math.min(W, H) * 0.045;
  ctx.strokeStyle = rgba(accent, 0.85); ctx.lineWidth = S.frame === 'full' ? 3 : 1.5;
  ctx.strokeRect(m, m, W - 2 * m, H - 2 * m);
  // 四角标
  const L = 18;
  ctx.lineWidth = 2.5;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x + L * sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + L * sy); ctx.stroke();
  });
  if (song && song.name) {
    ctx.fillStyle = rgba([255, 255, 255], 0.55);
    ctx.font = '600 11px "PingFang SC",system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(song.name + (song.artists ? ' — ' + song.artists : ''), m + 8, m - 8 > 12 ? m - 8 : m + 20);
  }
  // 底部时间码
  ctx.fillStyle = rgba([255, 255, 255], 0.4);
  ctx.font = '500 11px ui-monospace,monospace'; ctx.textAlign = 'right';
  const mm = String(Math.floor(t / 60)).padStart(2, '0'), ss = String(Math.floor(t % 60)).padStart(2, '0');
  ctx.fillText(`SONNET ${mm}:${ss}`, W - m - 8, H - m + 16);
  ctx.textAlign = 'left';
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) { curIdx = idx; shot = (shot + 1) % 3; } // 每句一切镜头
  beatPulse *= 0.94;
  // 背景：深底 + 封面主色微光
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0b0b10'); g.addColorStop(1, rgba(accent, 0.22));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const shx = window.__liziShake === false ? 0 : beatPulse * 5 * S.camera * (Math.random() - 0.5);
  const shy = window.__liziShake === false ? 0 : beatPulse * 5 * S.camera * (Math.random() - 0.5);
  ctx.save(); ctx.translate(shx, shy);
  if (S.frame !== 'none') drawFrame(t);
  // 动感图形：随拍点呼吸的圆环与三角
  const cx = W * 0.82, cy = H * 0.2, pr = 26 + beatPulse * 26 * S.motion;
  ctx.strokeStyle = rgba(accent, 0.5 + beatPulse * 0.4); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = rgba(accent, 0.35);
  ctx.beginPath(); ctx.moveTo(cx, cy - pr - 14); ctx.lineTo(cx + 10, cy - pr + 8); ctx.lineTo(cx - 10, cy - pr + 8); ctx.closePath(); ctx.fill();
  const line = lines[curIdx];
  if (line) {
    const chars = charsOf(line);
    const px = Math.min(W * 0.09, 64);
    const maxW = W * (shot === 2 ? 0.52 : 0.8);
    const fs = fitFont(line.text, px, maxW, 700);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textBaseline = 'middle';
    // 机位：0 居中 / 1 左置 / 2 分栏（右半）
    let bx = W / 2, by = H * 0.52; ctx.textAlign = 'center';
    if (shot === 1) { bx = W * 0.12; ctx.textAlign = 'left'; }
    if (shot === 2) { bx = W * 0.46; ctx.textAlign = 'left'; by = H * 0.46; }
    // 上下文：上一句淡化
    const prev = lines[curIdx - 1];
    if (prev && shot !== 2) {
      ctx.fillStyle = rgba([255, 255, 255], 0.28);
      ctx.font = `500 ${Math.round(fs * 0.42)}px "PingFang SC",system-ui,sans-serif`;
      ctx.fillText(prev.text, bx, by - fs * 0.95);
      ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    }
    // 逐字弹出：已唱的字实色，未唱的字描边淡色
    let x = bx;
    const totalW = ctx.measureText(line.text).width;
    if (ctx.textAlign === 'center') x = bx - totalW / 2;
    chars.forEach(ch => {
      const w = ctx.measureText(ch.c).width;
      const sung = t >= ch.t;
      const pop = sung ? Math.min(1, (t - ch.t) * 6) : 0;
      ctx.save();
      ctx.translate(x + w / 2, by);
      ctx.scale(1 + (1 - pop) * 0.35, 1 + (1 - pop) * 0.35);
      ctx.globalAlpha = sung ? 0.55 + 0.45 * pop : 0.3;
      ctx.fillStyle = sung ? rgb([255, 255, 255]) : rgba(accent, 0.9);
      if (sung) { ctx.shadowColor = rgb(accent); ctx.shadowBlur = 18 * beatPulse * S.motion + 6; }
      ctx.fillText(ch.c, -w / 2, 0);
      ctx.restore();
      x += w;
    });
    ctx.textAlign = 'left';
    // 拍点撕裂光
    if (beatPulse > 0.25) {
      ctx.fillStyle = rgba([255, 255, 255], (beatPulse - 0.25) * 0.5);
      ctx.fillRect(0, by - fs * 0.9, W, 2);
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
  ctx.restore();
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'camera') { const n = Number(v); if (isFinite(n)) S.camera = Math.min(3, Math.max(0, n)); }
  else if (p.key === 'motion') { const n = Number(v); if (isFinite(n)) S.motion = Math.min(3, Math.max(0, n)); }
  else if (p.key === 'frame') { const s = String(v); if (s === 'none' || s === 'frame' || s === 'full') S.frame = s; }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; shot = 0; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) beatPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
