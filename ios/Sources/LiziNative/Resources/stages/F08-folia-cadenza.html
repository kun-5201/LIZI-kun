<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>心象 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   心象（F08 · Folia cadenza / Mindscape）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 cadenza（Mindscape，心象）
   模式——字符散落成云，焦点字被光圈套住，光束穿过。本文件只学形态与流程，
   按 Lizi 舞台承载协议（__c100）独立重写，未复制 Folia 源码。
   形态：当前句的字散落在画面中央成一团云（位置由字哈希定死，不抖）；正在
   唱的字被光圈套住、带辉光；几道光束从中心向外；拍点时光圈胀一下。
   播放联动：init 换歌重排；tick 推时间；beat 推光圈脉冲。
   ========================================================================== */
const S = { fontScale: 1.12, motion: 1, glow: 1 };
window.__stagePanel = {
  title: '心象 · Folia',
  hint: '字符散落成云，焦点字被光圈套住。',
  items: [
    { key: 'fontScale', label: '字号', type: 'range', min: 0.6, max: 1.6, step: 0.05, def: 1.12 },
    { key: 'motion', label: '运动幅度', type: 'range', min: 0, max: 2, step: 0.1, def: 1 },
    { key: 'glow', label: '光辉强度', type: 'range', min: 0, max: 2, step: 0.1, def: 1 },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, ringPulse = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) curIdx = idx;
  ringPulse *= 0.94;
  ctx.fillStyle = '#0a0a12'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.46;
  // 光束：从中心向外
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2 + t * 0.05 * S.motion;
    const x2 = cx + Math.cos(a) * Math.max(W, H) * 0.6, y2 = cy + Math.sin(a) * Math.max(W, H) * 0.6;
    ctx.strokeStyle = rgba(accent, 0.10 * S.glow);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x2, y2); ctx.stroke();
  }
  const line = lines[curIdx];
  if (line) {
    const chars = charsOf(line);
    const fs = Math.min(W * 0.075, 56) * S.fontScale;
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 焦点字：当前唱到的字
    let focus = -1;
    chars.forEach((ch, i) => { if (t >= ch.t) focus = i; });
    chars.forEach((ch, i) => {
      // 散落成云：位置由字哈希定死 + 缓慢呼吸
      const hx = (hash(line.text + i) - 0.5) * W * 0.5;
      const hy = (hash('y' + line.text + i) - 0.5) * H * 0.24;
      const br = Math.sin(t * 0.8 + i) * 4 * S.motion;
      const x = cx + hx, y = cy + hy + br;
      const isFocus = i === focus;
      if (isFocus) {
        const r = fs * (0.85 + ringPulse * 0.3);
        ctx.strokeStyle = rgba(accent, 0.9 * S.glow);
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = rgba([255, 255, 255], 0.5);
        ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.stroke();
      }
      const sung = t >= ch.t;
      ctx.fillStyle = isFocus ? '#ffffff' : sung ? rgba([255, 255, 255], 0.75) : rgba(accent, 0.55);
      if (isFocus) { ctx.shadowColor = rgb(accent); ctx.shadowBlur = 20 * S.glow + ringPulse * 18; }
      ctx.fillText(ch.c, x, y);
      ctx.shadowBlur = 0;
    });
    const nxt = lines[curIdx + 1];
    if (nxt) {
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      ctx.font = '500 17px "PingFang SC",system-ui,sans-serif';
      ctx.fillText(nxt.text, cx, H * 0.82);
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'fontScale') { const n = Number(v); if (isFinite(n)) S.fontScale = Math.min(1.6, Math.max(0.6, n)); }
  else if (p.key === 'motion') { const n = Number(v); if (isFinite(n)) S.motion = Math.min(2, Math.max(0, n)); }
  else if (p.key === 'glow') { const n = Number(v); if (isFinite(n)) S.glow = Math.min(2, Math.max(0, n)); }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) ringPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
