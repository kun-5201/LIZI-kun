<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>莫奈 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#f2ede2;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(60,55,45,.45);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   莫奈（F13 · Folia monet）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 monet（莫奈）模式——
   海报式舞台：左侧关键字，右侧立绘；封面与说明随混音过渡换。本文件只学
   形态与流程，按 Lizi 舞台承载协议（__c100）独立重写，未复制 Folia 源码。
   形态：左侧竖排关键字（取当前句首词与歌名关键词）+ 右侧立绘（封面主色
   的印象派笔触剪影——圆点笔触拼的人形，无封面时纯色块剪影，不拉网图）；
   底部说明行；当前句压在画面下方。
   播放联动：init 换歌重排；tick 推时间；beat 让笔触亮度一跳。
   注意：本形态不联网取图——封面只取 init 里的 accent 主色作画，不读
   cover URL；各平台封面有无都不影响显示。
   ========================================================================== */
const S = { keywordColor: true, portrait: true, descMode: 'auto' };
window.__stagePanel = {
  title: '莫奈 · Folia',
  hint: '海报式舞台：左侧关键字，右侧立绘。',
  items: [
    { key: 'keywordColor', label: '关键词着色', type: 'switch', def: true },
    { key: 'portrait', label: '右侧立绘', type: 'switch', def: true },
    { key: 'descMode', label: '说明文字', type: 'segment', def: 'auto', options: [
      { v: 'auto', t: '自动' }, { v: 'always', t: '始终' }, { v: 'hidden', t: '隐藏' } ] },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, dabPulse = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function drawPortrait(px, py, pw, ph, t) {
  // 印象派笔触剪影：人形轮廓内填满主色圆点笔触
  ctx.save();
  ctx.beginPath();
  ctx.arc(px + pw / 2, py + ph * 0.2, pw * 0.2, 0, Math.PI * 2); // 头
  ctx.moveTo(px + pw * 0.5, py + ph * 0.38);
  ctx.bezierCurveTo(px + pw * 0.12, py + ph * 0.5, px + pw * 0.1, py + ph, px + pw * 0.32, py + ph);
  ctx.lineTo(px + pw * 0.68, py + ph);
  ctx.bezierCurveTo(px + pw * 0.9, py + ph, px + pw * 0.88, py + ph * 0.5, px + pw * 0.5, py + ph * 0.38);
  ctx.closePath();
  ctx.clip();
  for (let i = 0; i < 260; i++) {
    const dx = px + hash('dx' + i) * pw, dy = py + hash('dy' + i) * ph;
    const tone = hash('dt' + i);
    const col = tone > 0.66 ? [255, 255, 255] : tone > 0.33 ? accent : [accent[0] * 0.6, accent[1] * 0.6, accent[2] * 0.6];
    ctx.fillStyle = rgba(col, 0.5 + dabPulse * 0.3);
    ctx.beginPath(); ctx.arc(dx, dy, 3 + hash('dr' + i) * 7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = rgba([60, 55, 45], 0.5); ctx.lineWidth = 2;
  ctx.strokeRect(px, py, pw, ph);
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) curIdx = idx;
  dabPulse *= 0.94;
  ctx.fillStyle = '#f2ede2'; ctx.fillRect(0, 0, W, H);
  const line = lines[curIdx];
  // 左侧关键字：当前句首词 + 歌名
  const kw = line ? [...line.text].slice(0, 2).join('') : (song ? song.name.slice(0, 2) : '莫奈');
  ctx.fillStyle = S.keywordColor ? rgb(accent) : '#2a2620';
  ctx.font = `800 ${Math.min(W * 0.11, 84)}px "PingFang SC","Microsoft YaHei",serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(kw, W * 0.07, H * 0.12);
  ctx.fillStyle = 'rgba(42,38,32,0.55)';
  ctx.font = '500 16px "PingFang SC",system-ui,sans-serif';
  ctx.fillText('MONET · 莫奈', W * 0.07, H * 0.12 + Math.min(W * 0.11, 84) + 12);
  // 右侧立绘
  if (S.portrait) drawPortrait(W * 0.56, H * 0.1, W * 0.36, H * 0.52, t);
  // 说明行
  if (S.descMode !== 'hidden' && song && (S.descMode === 'always' || line)) {
    ctx.fillStyle = 'rgba(42,38,32,0.6)';
    ctx.font = '500 15px "PingFang SC",system-ui,sans-serif';
    ctx.fillText((song.artists ? song.artists + ' · ' : '') + (song.album || ''), W * 0.07, H * 0.66);
  }
  if (line) {
    const chars = charsOf(line);
    const fs = fitFont(line.text, Math.min(W * 0.075, 52), W * 0.86, 700);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const by = H * 0.78;
    const totalW = ctx.measureText(line.text).width;
    let x = W / 2 - totalW / 2;
    chars.forEach(ch => {
      const w = ctx.measureText(ch.c).width;
      const sung = t >= ch.t;
      ctx.fillStyle = sung ? '#221e18' : 'rgba(34,30,24,0.35)';
      ctx.fillText(ch.c, x + w / 2, by);
      x += w;
    });
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
  ctx.textAlign = 'left';
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'keywordColor') S.keywordColor = v !== false && v !== 'false';
  else if (p.key === 'portrait') S.portrait = v !== false && v !== 'false';
  else if (p.key === 'descMode') { const s = String(v); if (['auto', 'always', 'hidden'].includes(s)) S.descMode = s; }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) dabPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
