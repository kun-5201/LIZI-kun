<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>镜台 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#08090f;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   镜台（F15 · Folia diorama）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 diorama（镜台）模式——
   程序化 3D 歌词穿行：歌词同步的电影感运镜，不同景深上的几何体与粒子场，
   拍点激起涟漪。本文件只学形态与流程，按 Lizi 舞台承载协议（__c100）独立
   重写，未复制 Folia 源码；不依赖 React / three.js，用 2D 视差模拟纵深。
   形态：三层景深几何（远框 / 中块 / 近面）随镜头穿行视差移动；粒子微尘
   漂浮；当前句压在近面中央；行变（beat）时激起一圈涟漪。
   播放联动：init 换歌重排；tick 推时间与运镜；beat 触发涟漪。
   ========================================================================== */
const S = { cameraSpeed: 1, motion: 1, density: 1 };
window.__stagePanel = {
  title: '镜台 · Folia',
  hint: '程序化 3D 歌词穿行：多层景深 + 粒子场 + 拍点涟漪。',
  items: [
    { key: 'cameraSpeed', label: '相机速度', type: 'range', min: 0.55, max: 1.85, step: 0.05, def: 1 },
    { key: 'motion', label: '运动幅度', type: 'range', min: 0.4, max: 1.6, step: 0.1, def: 1 },
    { key: 'density', label: '粒子密度', type: 'range', min: 0, max: 2, step: 0.1, def: 1 },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, ripples = [];
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) {
    curIdx = idx;
    if (idx >= 0) ripples.push({ r: 10, a: 0.8 });
  }
  ctx.fillStyle = '#08090f'; ctx.fillRect(0, 0, W, H);
  const camX = Math.sin(t * 0.14 * S.cameraSpeed) * 40 * S.motion;
  const camY = Math.cos(t * 0.11 * S.cameraSpeed) * 24 * S.motion;
  const zoom = 1 + Math.sin(t * 0.07 * S.cameraSpeed) * 0.04 * S.motion;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2 + camX, -H / 2 + camY);
  // 远景：框
  ctx.strokeStyle = rgba(accent, 0.3); ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const s = 0.55 + i * 0.16;
    ctx.strokeRect(W / 2 - W * s / 2, H / 2 - H * s / 2, W * s, H * s);
  }
  // 中景：几何块（随句换位）
  for (let i = 0; i < 5; i++) {
    const bx = W * (0.12 + i * 0.18) + Math.sin(t * 0.2 + i) * 12 * S.motion;
    const by = H * (0.24 + hash('d' + i) * 0.5);
    const bs = 26 + hash('s' + i) * 40;
    ctx.fillStyle = rgba(accent, 0.16 + hash('a' + i) * 0.2);
    ctx.fillRect(bx, by, bs, bs * 0.6);
  }
  // 粒子微尘
  const n = Math.round(50 * S.density);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < n; i++) {
    const px = hash('px' + i) * W, py = ((hash('py' + i) + t * 0.008 * S.cameraSpeed) % 1) * H;
    ctx.globalAlpha = 0.2 + 0.5 * hash('pa' + i);
    ctx.fillRect(px, py, 2, 2);
  }
  ctx.globalAlpha = 1;
  // 涟漪
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 5; r.a -= 0.012;
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = rgba(accent, r.a);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, H * 0.5, r.r, 0, Math.PI * 2); ctx.stroke();
  }
  const line = lines[curIdx];
  if (line) {
    const chars = charsOf(line);
    const fs = fitFont(line.text, Math.min(W * 0.085, 60), W * 0.8, 700);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const totalW = ctx.measureText(line.text).width;
    let x = W / 2 - totalW / 2;
    chars.forEach(ch => {
      const w = ctx.measureText(ch.c).width;
      const sung = t >= ch.t;
      ctx.fillStyle = sung ? '#ffffff' : rgba(accent, 0.75);
      if (sung) { ctx.shadowColor = rgb(accent); ctx.shadowBlur = 16; }
      ctx.fillText(ch.c, x + w / 2, H * 0.5);
      ctx.shadowBlur = 0;
      x += w;
    });
    const nxt = lines[curIdx + 1];
    if (nxt) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      const nfs = fitFont(nxt.text, 18, W * 0.7, 500);
      ctx.font = `500 ${nfs}px "PingFang SC",system-ui,sans-serif`;
      ctx.fillText(nxt.text, W / 2, H * 0.5 + fs + 44);
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
  ctx.restore();
  ctx.textAlign = 'left';
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'cameraSpeed') { const n = Number(v); if (isFinite(n)) S.cameraSpeed = Math.min(1.85, Math.max(0.55, n)); }
  else if (p.key === 'motion') { const n = Number(v); if (isFinite(n)) S.motion = Math.min(1.6, Math.max(0.4, n)); }
  else if (p.key === 'density') { const n = Number(v); if (isFinite(n)) S.density = Math.min(2, Math.max(0, n)); }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; ripples = []; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) ripples.push({ r: 10, a: 0.8 });
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
