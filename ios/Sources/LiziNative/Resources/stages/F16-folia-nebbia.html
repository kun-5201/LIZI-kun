<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>雾笺 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.4);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   雾笺（F16 · Folia nebbia）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 nebbia（雾笺）模式——
   雨夜巴士车窗上结雾，指尖按笔画顺序写字抹开雾面、露出窗外城市；水珠沿
   抹痕聚起滑落，雾慢慢凝回；街上两盏聚光灯跟着正在唱的字。本文件只学形态
   与流程，按 Lizi 舞台承载协议（__c100）独立重写，未复制 Folia 源码。
   形态：窗外城市夜景（楼体灯点）→ 整屏雾面；当前句按字逐字“写”开——
   已唱的字把雾擦出透明字形（destination-out），雾按回凝速度慢慢盖回；
   雨滴沿玻璃滑落；两盏聚光灯跟随当前字。
   播放联动：init 换歌重排；tick 推时间；beat 让雨滴落下一批。
   注意：与目录里的 635 雾窗抹字不撞——635 是“夜车窗结雾，歌词藏在玻璃后，
   随唱句被指尖一行行抹开、又慢慢凝回”（且无文件、不可播），本形态是可播
   的同一题材完整实现；去重见交回报告。
   ========================================================================== */
const S = { regrow: 0.5, rain: true, spotlight: true, appear: 'auto' };
window.__stagePanel = {
  title: '雾笺 · Folia',
  hint: '雨夜雾窗：指尖写字抹开雾面，雾慢慢凝回。',
  items: [
    { key: 'regrow', label: '雾回凝速度', type: 'range', min: 0, max: 1, step: 0.05, def: 0.5 },
    { key: 'rain', label: '雨滴', type: 'switch', def: true },
    { key: 'spotlight', label: '聚光灯', type: 'switch', def: true },
    { key: 'appear', label: '出现方式', type: 'segment', def: 'auto', options: [
      { v: 'auto', t: '自动' }, { v: 'write', t: '书写' },
      { v: 'fade', t: '淡入' }, { v: 'breath', t: '呼吸' } ] },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

// 雾面离屏层：写字时擦出透明字，之后按回凝速度盖回
const fog = document.createElement('canvas');
const fctx = fog.getContext('2d');
function paintFog() {
  fog.width = Math.round(W * DPR); fog.height = Math.round(H * DPR);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.fillStyle = 'rgba(168,182,205,0.92)';
  fctx.fillRect(0, 0, W, H);
  // 雾面不均匀的斑块
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 20 + Math.random() * 70;
    const g = fctx.createRadialGradient(x, y, 2, x, y, r);
    g.addColorStop(0, 'rgba(190,202,222,0.25)');
    g.addColorStop(1, 'rgba(190,202,222,0)');
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
  }
}
paintFog();
addEventListener('resize', paintFog);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, drops = [], wiped = new Set();
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) {
    curIdx = idx;
    if (idx >= 0) { paintFog(); wiped = new Set(); } // 换句：雾重新盖满
  }
  // 窗外城市夜景
  ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 8; i++) {
    const bw = W * 0.11, bx = W * (0.02 + i * 0.12), bh = H * (0.2 + hash('n' + i) * 0.3);
    ctx.fillStyle = '#131a26';
    ctx.fillRect(bx, H - bh, bw, bh);
    for (let wy = 0; wy < 4; wy++) for (let wx2 = 0; wx2 < 2; wx2++) {
      if (hash('l' + i + wy + wx2) > 0.5) {
        ctx.fillStyle = hash('c' + i + wy) > 0.5 ? 'rgba(255,214,130,0.9)' : 'rgba(140,200,255,0.9)';
        ctx.fillRect(bx + 6 + wx2 * (bw / 2), H - bh + 10 + wy * 22, 8, 10);
      }
    }
  }
  const line = lines[curIdx];
  // 当前句：逐字把雾擦开（写字），擦开的字透出窗外灯光
  let focusX = W / 2, focusY = H * 0.48;
  if (line) {
    const chars = charsOf(line);
    const fs = fitFont(line.text, Math.min(W * 0.085, 60), W * 0.84, 700);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    fctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
    const totalW = ctx.measureText(line.text).width;
    let x = W / 2 - totalW / 2;
    let focus = -1;
    chars.forEach((ch, i) => {
      const w = ctx.measureText(ch.c).width;
      if (t >= ch.t) {
        focus = i;
        const key = curIdx + ':' + i;
        if (!wiped.has(key)) {
          wiped.add(key);
          // 书写：把雾擦出字形
          fctx.save();
          fctx.globalCompositeOperation = 'destination-out';
          fctx.fillText(ch.c, x + w / 2, H * 0.48);
          fctx.restore();
        }
      }
      x += w;
    });
    if (focus >= 0) {
      // 焦点字位置（聚光灯跟随）
      let fx = W / 2 - totalW / 2;
      for (let i = 0; i < focus; i++) fx += ctx.measureText(chars[i].c).width;
      focusX = fx + ctx.measureText(chars[focus].c).width / 2;
    }
    // 雾回凝：慢慢把擦开的字盖回（上一句的字）
    if (S.regrow > 0.01 && wiped.size > 0) {
      fctx.save();
      fctx.globalCompositeOperation = 'source-over';
      fctx.fillStyle = `rgba(168,182,205,${0.004 * S.regrow})`;
      fctx.fillRect(0, 0, W, H);
      fctx.restore();
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
  // 雾面
  ctx.drawImage(fog, 0, 0, W, H);
  // 聚光灯：两盏，跟随当前字
  if (S.spotlight && line) {
    [focusX - 70, focusX + 70].forEach(sx => {
      const sg = ctx.createRadialGradient(sx, focusY, 4, sx, focusY, 120);
      sg.addColorStop(0, 'rgba(255,240,200,0.20)');
      sg.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(sx, focusY, 120, 0, Math.PI * 2); ctx.fill();
    });
  }
  // 雨滴沿玻璃滑落
  if (S.rain) {
    if (drops.length < 60 && Math.random() < 0.5) drops.push({ x: Math.random() * W, y: -8, v: 120 + Math.random() * 160, r: 1.5 + Math.random() * 2 });
    ctx.fillStyle = 'rgba(200,215,240,0.55)';
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.y += d.v * 0.016;
      if (d.y > H) { drops.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(200,215,240,0.2)';
      ctx.fillRect(d.x - 0.5, d.y - 14, 1, 12);
      ctx.fillStyle = 'rgba(200,215,240,0.55)';
    }
  } else drops = [];
  // 雾面上的歌词淡影（未擦开的字仍可辨）
  if (line) {
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    const fs = fitFont(line.text, Math.min(W * 0.085, 60), W * 0.84, 700);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(line.text, W / 2, H * 0.48);
    ctx.textAlign = 'left';
  }
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'regrow') { const n = Number(v); if (isFinite(n)) S.regrow = Math.min(1, Math.max(0, n)); }
  else if (p.key === 'rain') S.rain = v !== false && v !== 'false';
  else if (p.key === 'spotlight') S.spotlight = v !== false && v !== 'false';
  else if (p.key === 'appear') { const s = String(v); if (['auto', 'write', 'fade', 'breath'].includes(s)) S.appear = s; }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; drops = []; wiped = new Set(); paintFog();
    clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (S.rain && window.__liziShake !== false) {
      for (let i = 0; i < 5; i++) drops.push({ x: Math.random() * W, y: -8, v: 160 + Math.random() * 160, r: 1.5 + Math.random() * 2 });
    }
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
