<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>九龙城寨 · Folia</title>
<script src="assets/508-three.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   九龙城寨（F18 · Folia machi / kowloon）// r51
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 machi（町景）引擎与其中
   kowloon（城寨酒吧）场景——共用引擎管渲染器、镜头、天光、天气、湿地面、
   后处理与编排，场景只管自己的几何、灯、招牌与会动的东西。本文件只学形态与
   流程（L 形楼排尺寸、酒吧大屏位置、霓虹招牌、全息 NEXT 面板、LED 逐字点亮、
   拍点霓虹脉冲的思路），按 Lizi 舞台承载协议（__c100）独立重写，未复制
   Folia 源码；不依赖 React / three.js 之外的库；F19 复用同一套迷你引擎写法。
   形态：左排 + 后排高低错落的城寨楼（L 形）、湿巷子、后排正中一楼酒吧（玻
   璃门面 + 暖光）、楼面 LED 大屏（当前句逐字点亮）、左楼面一串竖排霓虹招牌、
   巷子上空全息面板（下一句）、电线、亮窗、雨雪雾。
   播放联动：init 换歌重排（seed 取歌名，亮窗/招牌色重抽）；tick 推时间；
   beat 让霓虹与大屏亮度一跳；时段天气可调。
   注意：本形态不拉网图——封面只取 init 里的 accent 主色作霓虹色，不读
   cover URL；各平台封面有无都不影响显示。
   ========================================================================== */
const S = { timeOfDay: 'auto', weather: 'auto', drift: 0.5, shake: true };
window.__stagePanel = {
  title: '九龙城寨 · Folia',
  hint: '城寨酒吧：LED 大屏逐字点亮，霓虹招牌，全息下一句。',
  items: [
    { key: 'timeOfDay', label: '时段', type: 'segment', def: 'auto', options: [
      { v: 'auto', t: '自动' }, { v: 'day', t: '白天' }, { v: 'dusk', t: '黄昏' }, { v: 'night', t: '夜晚' } ] },
    { key: 'weather', label: '天气', type: 'segment', def: 'auto', options: [
      { v: 'auto', t: '自动' }, { v: 'clear', t: '晴' }, { v: 'rain', t: '雨' }, { v: 'snow', t: '雪' }, { v: 'fog', t: '雾' } ] },
    { key: 'drift', label: '镜头漂移', type: 'range', min: 0, max: 1, step: 0.05, def: 0.5 },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), hint = document.getElementById('hint');
const DPR_CAP = 1.5; // r51：Folia 高档 DPR 1.5 照抄思路，封顶 1.5
let W = 0, H = 0, DPR = 1;

let lines = [], song = null, accent = [150, 165, 255];
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, beatPulse = 0, seed = 1;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function rnd01(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function resolveTime() {
  if (S.timeOfDay !== 'auto') return S.timeOfDay;
  const h = new Date().getHours();
  return h >= 7 && h < 17 ? 'day' : h >= 17 && h < 19 ? 'dusk' : 'night';
}
function resolveWeather() {
  if (S.weather !== 'auto') return S.weather;
  return 'clear';
}
const rgb = (a) => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const cssA = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];

/* ================= 迷你 machi 引擎：渲染器 / 镜头 / 天光 / 天气 ================= */
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
scene.fog = new THREE.Fog(0x0b0d12, 18, 42);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const CAM_HOME = { pos: new THREE.Vector3(8.2, 4.6, 10.5), look: new THREE.Vector3(-1.2, 2.6, -2.2) };
camera.position.copy(CAM_HOME.pos);
camera.lookAt(CAM_HOME.look);
let viewYaw = 0, viewPitch = 0, viewZoom = 1;   // 拖动调视角（每场景各存一份的思路）
function resize() {
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0x8fa3c7, 0x1a1512, 0.55); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xbfd0ff, 0.5); moon.position.set(-6, 12, 4); scene.add(moon);
const amb = new THREE.AmbientLight(0xffffff, 0.12); scene.add(amb);
// 天光：白天 / 黄昏 / 夜晚三套，按时段插值（Folia 环境思路）
const SKY = {
  day:   { bg: 0x9db8d9, fog: 0x9db8d9, hemiSky: 0xbfd4ea, hemiGround: 0x5c5648, moon: 0xfff2d0, mi: 0.9, hi: 0.9 },
  dusk:  { bg: 0x3a2b4d, fog: 0x3a2b4d, hemiSky: 0xe8824f, hemiGround: 0x2c2233, moon: 0xffb36b, mi: 0.5, hi: 0.5 },
  night: { bg: 0x0b0d12, fog: 0x0b0d12, hemiSky: 0x8fa3c7, hemiGround: 0x1a1512, moon: 0xbfd0ff, mi: 0.5, hi: 0.55 },
};
function applySky(tod, k) {
  const s = SKY[tod];
  scene.background.setHex(s.bg); scene.fog.color.setHex(s.fog);
  hemi.color.setHex(s.hemiSky); hemi.groundColor.setHex(s.hemiGround);
  hemi.intensity = s.hi; moon.color.setHex(s.moon); moon.intensity = s.mi;
}

/* ================= 场景：城寨楼（Folia 布局尺寸） ================= */
const WALLS = [0x4a4640, 0x55483c, 0x3f4448, 0x5a4a42, 0x46413a];
const BLOCKS = [  // 左排 L0–L5 + 后排 B0–B2（B1 是酒吧与大屏）
  { n: 'L0', x0: -6, x1: -3.0, z0: -6, z1: -1.8, h: 6.9, w: 0 },
  { n: 'L1', x0: -6, x1: -3.35, z0: -1.8, z1: -0.2, h: 7.3, w: 1 },
  { n: 'L2', x0: -6, x1: -3.6, z0: -0.2, z1: 1.3, h: 6.6, w: 2 },
  { n: 'L3', x0: -6, x1: -3.2, z0: 1.3, z1: 2.9, h: 6.2, w: 3 },
  { n: 'L4', x0: -6, x1: -3.45, z0: 2.9, z1: 4.5, h: 5.2, w: 4 },
  { n: 'L5', x0: -6, x1: -3.75, z0: 4.5, z1: 6, h: 4.0, w: 2 },
  { n: 'B0', x0: -3.0, x1: -1.6, z0: -6, z1: -1.8, h: 6.4, w: 4 },
  { n: 'B0b', x0: -1.6, x1: -0.3, z0: -6, z1: -2.05, h: 7.0, w: 3 },
  { n: 'B1', x0: -0.3, x1: 4.5, z0: -6, z1: -1.5, h: 6.2, w: 0, bar: true },
  { n: 'B2', x0: 4.5, x1: 6, z0: -6, z1: -2.3, h: 5.4, w: 1 },
];
const wallMats = WALLS.map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.92 }));
const darkMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.95 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1c1e24, roughness: 0.25, metalness: 0.55 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0.02, 0); scene.add(ground);
const winLitMat = new THREE.MeshBasicMaterial({ color: 0xffd682, toneMapped: false });
const winDarkMat = new THREE.MeshStandardMaterial({ color: 0x10131a, roughness: 0.6 });
const winGeo = new THREE.PlaneGeometry(0.42, 0.55);
const winSpots = [];
for (const b of BLOCKS) {
  const w = b.x1 - b.x0, d = b.z1 - b.z0;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, b.h, d), wallMats[b.w]);
  m.position.set((b.x0 + b.x1) / 2, b.h / 2, (b.z0 + b.z1) / 2); scene.add(m);
  // 亮窗：沿楼面按层排，seed 定亮灭
  const floors = Math.max(1, Math.floor((b.h - 3) / 1));
  for (let f = 0; f < floors; f++) {
    for (let k = 0; k < Math.max(1, Math.floor(w / 1.1)); k++) {
      winSpots.push({ x: b.x0 + 0.6 + k * 1.1, y: 3.4 + f * 1.0, z: b.z1 + 0.02, on: rnd01(seed * 7 + f * 13 + k * 3 + b.h) > 0.45 });
    }
  }
}
const winMesh = new THREE.InstancedMesh(winGeo, winLitMat, winSpots.length);
const winDark = new THREE.InstancedMesh(winGeo, winDarkMat, winSpots.length);
{
  const m4 = new THREE.Matrix4();
  let li = 0, di = 0;
  winSpots.forEach((s) => {
    m4.makeTranslation(s.x, s.y, s.z);
    if (s.on) winMesh.setMatrixAt(li++, m4); else winDark.setMatrixAt(di++, m4);
  });
  winMesh.count = li; winDark.count = di;
  scene.add(winMesh); scene.add(winDark);
}
// 酒吧一楼：玻璃门面往里收 + 暖光内厅 + 柜台
const barGlowMat = new THREE.MeshBasicMaterial({ color: 0xffb46b, toneMapped: false });
{
  const front = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 2.9),
    new THREE.MeshStandardMaterial({ color: 0x2a1c12, roughness: 0.4, metalness: 0.3 }));
  front.position.set(2.1, 1.5, -1.48); scene.add(front);
  const inner = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 2.5), barGlowMat);
  inner.position.set(2.1, 1.45, -1.55); scene.add(inner);
  const counter = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.9, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 0.7 }));
  counter.position.set(2.1, 0.5, -1.2); scene.add(counter);
  const barLight = new THREE.PointLight(0xffb46b, 9, 9, 1.6);
  barLight.position.set(2.1, 2.2, -0.6); scene.add(barLight);
  // 大排档：前右矮摊
  const stall = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.0, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x27313d, roughness: 0.85 }));
  stall.position.set(4.6, 0.55, 3.6); scene.add(stall);
  const awn = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.08, 1.3),
    new THREE.MeshStandardMaterial({ color: 0x8a2f2f, roughness: 0.8 }));
  awn.position.set(4.6, 1.25, 3.6); awn.rotation.z = 0.12; scene.add(awn);
}
// 电线杆 + 垂线
{
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x2c2f36, roughness: 0.9 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 5.4, 8), poleMat);
  pole.position.set(5.6, 2.7, 2.2); scene.add(pole);
  const lineMat = new THREE.LineBasicMaterial({ color: 0x0a0a0c, transparent: true, opacity: 0.9 });
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const p = i / 12;
    pts.push(new THREE.Vector3(lerp(5.6, -3.4, p), 5.1 - Math.sin(p * Math.PI) * 0.7, lerp(2.2, -1.4, p)));
  }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
}
// 空调外机 + 杂物（剪影层）
for (let i = 0; i < 10; i++) {
  const b = BLOCKS[i % BLOCKS.length];
  const ac = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.25), darkMat);
  ac.position.set(b.x1 + 0.15, 2.2 + rnd01(seed + i) * 3, b.z0 + 0.6 + rnd01(seed + i * 3) * (b.z1 - b.z0 - 1.2));
  scene.add(ac);
}

/* ---- 歌词大屏（B1 楼面）与霓虹招牌、全息面板：画布贴图，只在行变化时重画 ---- */
function textCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const boardC = textCanvas(1024, 420), boardX = boardC.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardC); boardTex.colorSpace = THREE.SRGBColorSpace;
const boardMat = new THREE.MeshBasicMaterial({ map: boardTex, toneMapped: false });
const board = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.9), boardMat);
board.position.set(2.1, 4.6, -1.44); scene.add(board);
const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.1, 0.08),
  new THREE.MeshStandardMaterial({ color: 0x26282d, roughness: 0.6, metalness: 0.4 }));
boardFrame.position.set(2.1, 4.6, -1.52); scene.add(boardFrame);
boardFrame.position.z = -1.52; board.position.z = -1.46;
let lastBoardSung = -2, lastBoardIdx = -2;
function drawBoard() {
  const g = boardX, w = boardC.width, h = boardC.height, t = now();
  g.fillStyle = '#05070c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = `rgba(${accent[0] | 0},${accent[1] | 0},${accent[2] | 0},0.7)`;
  g.lineWidth = 6; g.strokeRect(6, 6, w - 12, h - 12);
  const line = lines[curIdx];
  if (!line) {
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.font = '500 40px "PingFang SC",system-ui,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(lines.length ? '等待第一句…' : '这首没有歌词', w / 2, h / 2);
  } else {
    const chars = charsOf(line);
    let sung = 0; for (const ch of chars) if (t >= ch.t) sung++;
    lastBoardSung = sung;
    let fs = 110;
    g.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    while (fs > 40 && g.measureText(line.text).width > w - 80) {
      fs -= 4; g.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const totalW = g.measureText(line.text).width;
    let x = w / 2 - totalW / 2;
    chars.forEach((ch, i) => {
      const cw = g.measureText(ch.c).width;
      const lit = i < sung;
      g.fillStyle = lit ? '#78ffaa' : 'rgba(120,255,170,0.28)';
      if (lit) { g.shadowColor = '#78ffaa'; g.shadowBlur = 16 + beatPulse * 16; }
      g.fillText(ch.c, x + cw / 2, h / 2);
      g.shadowBlur = 0;
      x += cw;
    });
    // LED 像素格
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (let gx = 0; gx < w; gx += 12) for (let gy = 0; gy < h; gy += 12) g.fillRect(gx, gy, 1, 1);
  }
  boardTex.needsUpdate = true;
  lastBoardIdx = curIdx;
}
drawBoard();
// 竖排霓虹招牌（左楼面，悬在巷子上空）
const NEON_SIGNS = [
  { text: '酒吧', color: '#ff4d6d', x: -3.2, y: 4.6, z: 0.6 },
  { text: '霓虹', color: '#37e0ff', x: -3.3, y: 5.2, z: 2.4 },
  { text: '大排檔', color: '#ffb03a', x: -3.15, y: 4.0, z: -1.2 },
  { text: '通宵', color: '#c77dff', x: -3.3, y: 5.6, z: 4.2 },
];
const neonMats = [];
for (const s of NEON_SIGNS) {
  const c = textCanvas(160, 480), g = c.getContext('2d');
  g.fillStyle = '#0a0a10'; g.fillRect(0, 0, 160, 480);
  g.fillStyle = s.color; g.font = '800 96px "PingFang SC",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  [...s.text].forEach((ch, i) => g.fillText(ch, 80, 90 + i * 130));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
  neonMats.push({ mat, base: s.color });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 1.65), mat);
  m.position.set(s.x, s.y, s.z); m.rotation.y = Math.PI / 2; scene.add(m);
  // 湿地面上的霓虹倒影（淡色竖条）
  const refl = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 1.1),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(s.color), transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending, depthWrite: false }));
  refl.rotation.x = -Math.PI / 2; refl.position.set(s.x + 1.4, 0.04, s.z); scene.add(refl);
}
// 全息面板：巷子上空，写下一句（Folia：下一句；没有时写曲名与歌手）
const holoC = textCanvas(1024, 376), holoX = holoC.getContext('2d');
const holoTex = new THREE.CanvasTexture(holoC); holoTex.colorSpace = THREE.SRGBColorSpace;
const holoMat = new THREE.MeshBasicMaterial({ map: holoTex, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
const holo = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.95), holoMat);
holo.position.set(-0.6, 2.4, 2.6); holo.rotation.y = 0.5; scene.add(holo);
const holoBeamMat = new THREE.MeshBasicMaterial({ color: 0x37e0ff, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const holoBeam = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.2, 12, 1, true), holoBeamMat);
holoBeam.position.set(-0.6, 1.2, 2.6); scene.add(holoBeam);
let lastHoloKey = '';
function drawHolo() {
  const g = holoX, w = holoC.width, h = holoC.height;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(120,220,255,0.8)'; g.lineWidth = 4; g.strokeRect(8, 8, w - 16, h - 16);
  const nxt = lines[curIdx + 1];
  const label = nxt ? 'NEXT' : 'NOW PLAYING';
  const text = nxt ? nxt.text : (song && song.name ? (song.artists ? song.name + ' — ' + song.artists : song.name) : 'KOWLOON');
  g.fillStyle = 'rgba(120,220,255,0.75)';
  g.font = '600 30px ui-monospace,monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(label, 40, 48);
  g.fillStyle = '#dff6ff';
  let fs = 64;
  g.font = `700 ${fs}px "PingFang SC",system-ui,sans-serif`;
  while (fs > 30 && g.measureText(text).width > w - 80) { fs -= 4; g.font = `700 ${fs}px "PingFang SC",system-ui,sans-serif`; }
  g.fillText(text, 40, h / 2 + 30);
  // 扫描线
  g.fillStyle = 'rgba(120,220,255,0.10)';
  for (let y = 0; y < h; y += 8) g.fillRect(0, y, w, 2);
  holoTex.needsUpdate = true;
  lastHoloKey = (curIdx + 1) + '|' + text;
}
drawHolo();
// 雨 / 雪粒子
const FALL_N = 420, fallPos = new Float32Array(FALL_N * 3);
for (let i = 0; i < FALL_N; i++) {
  fallPos[i * 3] = (Math.random() - 0.5) * 16;
  fallPos[i * 3 + 1] = Math.random() * 10;
  fallPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
}
const fallGeo = new THREE.BufferGeometry();
fallGeo.setAttribute('position', new THREE.BufferAttribute(fallPos, 3));
const fallMat = new THREE.PointsMaterial({ color: 0xb4c8eb, size: 0.07, transparent: true, opacity: 0.0, depthWrite: false });
const fall = new THREE.Points(fallGeo, fallMat); scene.add(fall);
// 夜星
const STAR_N = 200, starPos = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 60;
  starPos[i * 3 + 1] = 12 + Math.random() * 20;
  starPos[i * 3 + 2] = -20 - Math.random() * 20;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 });
const stars = new THREE.Points(starGeo, starMat); scene.add(stars);

/* ---- 拖动调视角 ---- */
let dragging = false, px = 0, py = 0;
cv.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; ping(); });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  viewYaw = clamp(viewYaw - (e.clientX - px) * 0.004, -0.6, 0.6);
  viewPitch = clamp(viewPitch + (e.clientY - py) * 0.003, -0.25, 0.35);
  px = e.clientX; py = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('wheel', (e) => { viewZoom = clamp(viewZoom - e.deltaY * 0.0006, 0.6, 1.8); }, { passive: true });

/* ---- 主循环：暂停且无天气动画时停 rAF，切后台也停 ---- */
let rafId = 0, lastMs = 0, loopOn = false, ambT = 0;
function frame(ms) {
  if (!loopOn) return;
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms - lastMs) / 1000 || 0.016); lastMs = ms;
  ambT += dt;
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) { curIdx = idx; drawBoard(); drawHolo(); }
  else if (curIdx >= 0) {
    const line = lines[curIdx], chars = charsOf(line);
    let sung = 0; for (const ch of chars) if (t >= ch.t) sung++;
    if (sung !== lastBoardSung) drawBoard();
  }
  const tod = resolveTime(), wx = resolveWeather();
  applySky(tod);
  stars.visible = tod === 'night';
  // 镜头：默认构图 + 缓慢漂移 + 拖动视角
  const driftA = Math.sin(ambT * 0.1) * 0.5 * S.drift;
  const yaw = viewYaw + driftA * 0.12, pitch = viewPitch + Math.sin(ambT * 0.07) * 0.02 * S.drift;
  const dist = 13.4 / viewZoom;
  camera.position.set(
    CAM_HOME.look.x + Math.sin(yaw) * dist * 0.62,
    CAM_HOME.look.y + 2.0 + pitch * 4,
    CAM_HOME.look.z + Math.cos(yaw) * dist * 0.85);
  camera.lookAt(CAM_HOME.look.x, CAM_HOME.look.y + pitch * 2, CAM_HOME.look.z);
  beatPulse *= Math.exp(-dt * 3);
  // 霓虹脉冲：拍点一跳 + 偶尔闪烁
  const flick = (rnd01(Math.floor(ambT * 7) + 3) > 0.93) ? 0.55 : 1;
  neonMats.forEach((n, i) => {
    const pulse = 0.75 + beatPulse * 0.5 + Math.sin(ambT * 2 + i * 1.7) * 0.06;
    n.mat.color.setScalar(clamp(pulse * flick, 0.3, 1.4));
  });
  boardMat.color.setScalar(0.85 + beatPulse * 0.3);
  holoMat.opacity = 0.7 + beatPulse * 0.2 + (tod === 'day' ? -0.35 : 0);
  holoBeamMat.opacity = 0.04 + beatPulse * 0.03;
  // 雨雪
  const falling = wx === 'rain' || wx === 'snow';
  fallMat.opacity = falling ? (wx === 'rain' ? 0.55 : 0.85) : 0;
  if (falling) {
    const fp = fallGeo.attributes.position;
    const v = wx === 'rain' ? 9 : 1.4;
    for (let i = 0; i < FALL_N; i++) {
      let y = fp.getY(i) - v * dt * (0.7 + rnd01(i) * 0.6);
      if (y < 0) y = 10;
      fp.setY(i, y);
      if (wx === 'snow') fp.setX(i, fp.getX(i) + Math.sin(ambT + i) * dt * 0.3);
    }
    fp.needsUpdate = true;
  }
  scene.fog.density = 0;
  scene.fog.near = wx === 'fog' ? 8 : 18;
  scene.fog.far = wx === 'fog' ? 22 : 42;
  const ho = lines.length ? (curIdx >= 0 ? '0' : '1') : '0.5';
  if (hint.style.opacity !== ho) hint.style.opacity = ho;
  renderer.render(scene, camera);
  if (!playing && !falling && wx !== 'fog') stopLoop();
}
function ensureLoop() {
  if (loopOn) return;
  loopOn = true; lastMs = performance.now();
  rafId = requestAnimationFrame(frame);
}
function stopLoop() { loopOn = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop(); else ensureLoop();
});
ensureLoop();

/* ---- 与播放器通信（__c100） ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'timeOfDay') { const s = String(v); if (['auto', 'day', 'dusk', 'night'].includes(s)) S.timeOfDay = s; }
  else if (p.key === 'weather') { const s = String(v); if (['auto', 'clear', 'rain', 'snow', 'fog'].includes(s)) S.weather = s; }
  else if (p.key === 'drift') { const n = Number(v); if (isFinite(n)) S.drift = clamp(n, 0, 1); }
}
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    seed = hash((song && song.name) || 'kowloon') * 1000 + 1;
    curIdx = -1; lastBoardSung = -2; lastBoardIdx = -2; lastHoloKey = '';
    clockT = 0; clockAt = performance.now();
    drawBoard(); drawHolo();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    ensureLoop();
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    const was = playing; playing = !!d.payload.playing;
    if (playing || playing !== was) ensureLoop();
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) beatPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
    ensureLoop();
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
    ensureLoop();
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
window.__stage = () => ({ lines: lines.length, curIdx, board: lastBoardIdx, holo: lastHoloKey, t: +now().toFixed(2) });
</script>
