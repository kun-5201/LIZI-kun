<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>车站 · Folia</title>
<script src="assets/508-three.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0d1017;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   车站（F19 · Folia machi / station）// r51
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 machi（町景）引擎与其中
   station（加油站停车场）场景——与 F18 同一套迷你引擎（渲染器、镜头、天光、
   天气、湿地面、编排），场景只管自己的几何、灯、招牌与会动的东西。本文件只
   学形态与流程（罩棚与加油岛尺寸、货车侧屏位置、双车道过车、出租车顶灯的
   思路），按 Lizi 舞台承载协议（__c100）独立重写，未复制 Folia 源码；不依赖
   React / three.js 之外的库。
   形态：前排双车道公路（过车不断）+ 停车场 + 后排右边加油站罩棚（四柱、
   品牌条）与两座加油岛 + 后排左边广告货车（货厢侧面是 LED 大屏，当前句逐字
   点亮）+ 高立牌（歌名）+ 停着的轿车 / 出租车（顶灯「空車」）/ 轻卡 + 路灯。
   播放联动：init 换歌重排（seed 取歌名，车身色与立牌重抽）；tick 推时间；
   beat 让大屏与顶灯亮度一跳；时段天气可调，车流可调。
   注意：本形态不拉网图——封面只取 init 里的 accent 主色作品牌条与大屏边框，
   不读 cover URL；各平台封面有无都不影响显示。
   ========================================================================== */
const S = { timeOfDay: 'auto', weather: 'auto', traffic: 0.6, drift: 0.5, shake: true };
window.__stagePanel = {
  title: '车站 · Folia',
  hint: '加油站停车场：货车侧屏逐字点亮，双车道过车不断。',
  items: [
    { key: 'timeOfDay', label: '时段', type: 'segment', def: 'auto', options: [
      { v: 'auto', t: '自动' }, { v: 'day', t: '白天' }, { v: 'dusk', t: '黄昏' }, { v: 'night', t: '夜晚' } ] },
    { key: 'weather', label: '天气', type: 'segment', def: 'auto', options: [
      { v: 'auto', t: '自动' }, { v: 'clear', t: '晴' }, { v: 'rain', t: '雨' }, { v: 'snow', t: '雪' }, { v: 'fog', t: '雾' } ] },
    { key: 'traffic', label: '车流', type: 'range', min: 0, max: 1, step: 0.05, def: 0.6 },
    { key: 'drift', label: '镜头漂移', type: 'range', min: 0, max: 1, step: 0.05, def: 0.5 },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), hint = document.getElementById('hint');
const DPR_CAP = 1.5; // r51：Folia 高档 DPR 1.5 照抄思路，封顶 1.5
let W = 0, H = 0, DPR = 1;

let lines = [], song = null, accent = [150, 165, 255];
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, beatPulse = 0, seed = 1;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function rnd01(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function resolveTime() {
  if (S.timeOfDay !== 'auto') return S.timeOfDay;
  const h = new Date().getHours();
  return h >= 7 && h < 17 ? 'day' : h >= 17 && h < 19 ? 'dusk' : 'night';
}
function resolveWeather() {
  if (S.weather !== 'auto') return S.weather;
  return 'clear';
}

/* ================= 迷你 machi 引擎：渲染器 / 镜头 / 天光 / 天气（与 F18 同款写法） ================= */
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1017);
scene.fog = new THREE.Fog(0x0d1017, 20, 48);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const CAM_HOME = { pos: new THREE.Vector3(7.8, 4.8, 11.5), look: new THREE.Vector3(-0.6, 2.0, -2.0) };
camera.position.copy(CAM_HOME.pos);
camera.lookAt(CAM_HOME.look);
let viewYaw = 0, viewPitch = 0, viewZoom = 1;
function resize() {
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0x8fa3c7, 0x1a1512, 0.55); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xbfd0ff, 0.5); moon.position.set(-6, 12, 4); scene.add(moon);
const amb = new THREE.AmbientLight(0xffffff, 0.12); scene.add(amb);
const SKY = {
  day:   { bg: 0x9db8d9, fog: 0x9db8d9, hemiSky: 0xbfd4ea, hemiGround: 0x5c5648, moon: 0xfff2d0, mi: 0.9, hi: 0.9 },
  dusk:  { bg: 0x3a2b4d, fog: 0x3a2b4d, hemiSky: 0xe8824f, hemiGround: 0x2c2233, moon: 0xffb36b, mi: 0.5, hi: 0.5 },
  night: { bg: 0x0d1017, fog: 0x0d1017, hemiSky: 0x8fa3c7, hemiGround: 0x1a1512, moon: 0xbfd0ff, mi: 0.5, hi: 0.55 },
};
function applySky(tod) {
  const s = SKY[tod];
  scene.background.setHex(s.bg); scene.fog.color.setHex(s.fog);
  hemi.color.setHex(s.hemiSky); hemi.groundColor.setHex(s.hemiGround);
  hemi.intensity = s.hi; moon.color.setHex(s.moon); moon.intensity = s.mi;
}

/* ================= 场景：加油站停车场（Folia 布局尺寸） ================= */
function std(color, rough, metal) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough == null ? 0.9 : rough, metalness: metal || 0 });
}
function box(w, h, d, mat, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); if (ry) m.rotation.y = ry; scene.add(m); return m;
}
// 地面：停车场 + 前排双车道公路（沿 x，车道中线 z 3.36 / 4.99，靠左行驶）
const lot = new THREE.Mesh(new THREE.PlaneGeometry(16, 13), std(0x23262e, 0.3, 0.5));
lot.rotation.x = -Math.PI / 2; lot.position.set(0, 0.02, -1.2); scene.add(lot);
const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 3.65), std(0x191b20, 0.35, 0.4));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.03, 4.17); scene.add(road);
for (let x = -7.5; x < 7.5; x += 1.1) {  // 车道虚线
  box(0.55, 0.01, 0.09, std(0xd8d8d8, 0.6), x, 0.05, 4.17);
}
box(16, 0.16, 0.24, std(0x3a3d44, 0.9), 0, 0.08, 2.3);   // 路缘
// 加油区抬高混凝土
box(4.8, 0.1, 6.4, std(0x4a4d52, 0.85), 3.6, 0.05, -2.8);
// 罩棚：后排右边，四柱，前沿与右沿挂品牌条（accent 色）
const canopyMat = std(0xe8e4da, 0.7);
box(4.5, 0.45, 4.2, canopyMat, 3.65, 4.07, -3.5);
const brandMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(`rgb(${accent[0] | 0},${accent[1] | 0},${accent[2] | 0})`), toneMapped: false });
box(4.5, 0.3, 0.06, brandMat, 3.65, 3.9, -1.38);
box(0.06, 0.3, 4.2, brandMat, 5.92, 3.9, -3.5);
const colMat = std(0x9aa0a8, 0.5, 0.5);
for (const [cx, cz] of [[2.05, -2.1], [5.25, -2.1], [2.05, -4.9], [5.25, -4.9]]) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 3.85, 10), colMat);
  c.position.set(cx, 1.92, cz); scene.add(c);
}
// 加油岛两座，各两台加油机
for (const iz of [-4.35, -2.75]) {
  box(2.4, 0.16, 0.5, std(0x6a6e75, 0.8), 3.65, 0.08, iz);
  for (const px of [3.05, 4.25]) {
    box(0.42, 1.25, 0.36, std(0xd8d5cc, 0.6), px, 0.78, iz);
    box(0.44, 0.1, 0.38, brandMat, px, 1.32, iz);
  }
}
const canopyLight = new THREE.PointLight(0xffe2b0, 8, 10, 1.6);
canopyLight.position.set(3.65, 3.6, -3.5); scene.add(canopyLight);
// 高立牌（歌名）：前排细高，朝 +z
const pylonC = document.createElement('canvas'); pylonC.width = 256; pylonC.height = 640;
const pylonX = pylonC.getContext('2d');
const pylonTex = new THREE.CanvasTexture(pylonC); pylonTex.colorSpace = THREE.SRGBColorSpace;
function drawPylon() {
  const g = pylonX, w = 256, h = 640;
  g.fillStyle = '#101319'; g.fillRect(0, 0, w, h);
  g.fillStyle = `rgb(${accent[0] | 0},${accent[1] | 0},${accent[2] | 0})`;
  g.fillRect(0, 0, w, 26); g.fillRect(0, h - 26, w, 26);
  g.fillStyle = '#fff'; g.font = '800 44px "PingFang SC",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const name = (song && song.name) || 'LIZI';
  const chars = [...name];
  const step = Math.min(64, (h - 120) / Math.max(1, chars.length));
  chars.forEach((ch, i) => g.fillText(ch, w / 2, 90 + i * step));
  pylonTex.needsUpdate = true;
}
drawPylon();
box(0.18, 5.6, 0.18, std(0x2c2f36, 0.8), -5.4, 2.8, 0.6);
const pylon = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 2.25),
  new THREE.MeshBasicMaterial({ map: pylonTex, toneMapped: false }));
pylon.position.set(-5.4, 5.4, 0.6); scene.add(pylon);
// 停着的车：轿车 / 出租车（顶灯「空車」）/ 轻卡，车头朝 +z，摆时再转
const CAR_COLORS = [0x8a2f2f, 0x2f4d8a, 0x3d6b4f, 0x777777, 0xb08a2f];
function parkedCar(kind, x, z, ry) {
  const g = new THREE.Group();
  const len = kind === 'kei' ? 3.0 : 4.2, wid = kind === 'kei' ? 1.36 : 1.75;
  const bodyC = kind === 'taxi' ? 0xd8c23a : CAR_COLORS[Math.floor(rnd01(seed + x * 7 + z) * CAR_COLORS.length)];
  const body = new THREE.Mesh(new THREE.BoxGeometry(wid, 0.55, len), std(bodyC, 0.35, 0.6));
  body.position.y = 0.55; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(wid * 0.85, 0.5, len * 0.5), std(0x1a2028, 0.25, 0.4));
  cabin.position.set(0, 1.05, -len * 0.08); g.add(cabin);
  const wheelG = new THREE.CylinderGeometry(0.27, 0.27, 0.2, 12); wheelG.rotateZ(Math.PI / 2);
  const wheelM = std(0x0c0c0e, 0.95);
  for (const [wx, wz] of [[-wid / 2, len * 0.32], [wid / 2, len * 0.32], [-wid / 2, -len * 0.32], [wid / 2, -len * 0.32]]) {
    const wh = new THREE.Mesh(wheelG, wheelM); wh.position.set(wx, 0.27, wz); g.add(wh);
  }
  let andon = null;
  if (kind === 'taxi') {
    const c = document.createElement('canvas'); c.width = 256; c.height = 96;
    const gg = c.getContext('2d');
    gg.fillStyle = '#111'; gg.fillRect(0, 0, 256, 96);
    gg.fillStyle = '#7dff9a'; gg.font = '700 56px "PingFang SC",sans-serif';
    gg.textAlign = 'center'; gg.textBaseline = 'middle'; gg.fillText('空車', 128, 52);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    andon = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.2),
      new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
    andon.position.set(0, 1.38, len * 0.1); g.add(andon);
  }
  g.position.set(x, 0, z); g.rotation.y = ry || 0; scene.add(g);
  return { group: g, andon };
}
parkedCar('sedan', -2.6, 1.2, 0.12);
const taxi = parkedCar('taxi', 0.4, 1.4, -0.08);
parkedCar('kei', -4.4, -0.6, 0.5);
// 广告货车：后排左边沿 x 停着，货厢侧面朝 +z 是 LED 大屏
const truck = new THREE.Group();
{
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.5, 1.7), std(0x2f4d8a, 0.4, 0.5));
  cab.position.set(2.6, 0.95, 0); truck.add(cab);
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(4.6, 2.2, 1.9), std(0xe8e4da, 0.7));
  cargo.position.set(-0.6, 1.3, 0); truck.add(cargo);
  const wheelG = new THREE.CylinderGeometry(0.34, 0.34, 0.22, 12); wheelG.rotateZ(Math.PI / 2);
  const wheelM = std(0x0c0c0e, 0.95);
  for (const [wx, wz] of [[2.6, 0.95], [2.6, -0.95], [-2.4, 0.95], [-2.4, -0.95], [0.4, 0.95], [0.4, -0.95]]) {
    const wh = new THREE.Mesh(wheelG, wheelM); wh.position.set(wx, 0.34, wz); truck.add(wh);
  }
  truck.position.set(-3.4, 0, -4.6); scene.add(truck);
}
// LED 大屏（货厢侧面）：画布贴图，只在行变化时重画
function textCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const boardC = textCanvas(1024, 420), boardX = boardC.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardC); boardTex.colorSpace = THREE.SRGBColorSpace;
const boardMat = new THREE.MeshBasicMaterial({ map: boardTex, toneMapped: false });
const board = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.75), boardMat);
board.position.set(-4.0, 1.35, -3.62); scene.add(board);
let lastBoardSung = -2, lastBoardIdx = -2;
function drawBoard() {
  const g = boardX, w = boardC.width, h = boardC.height, t = now();
  g.fillStyle = '#05070c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = `rgba(${accent[0] | 0},${accent[1] | 0},${accent[2] | 0},0.8)`;
  g.lineWidth = 6; g.strokeRect(6, 6, w - 12, h - 12);
  const line = lines[curIdx];
  if (!line) {
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.font = '500 40px "PingFang SC",system-ui,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(lines.length ? '等待第一句…' : '这首没有歌词', w / 2, h / 2);
  } else {
    const chars = charsOf(line);
    let sung = 0; for (const ch of chars) if (t >= ch.t) sung++;
    lastBoardSung = sung;
    let fs = 110;
    g.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    while (fs > 40 && g.measureText(line.text).width > w - 80) {
      fs -= 4; g.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const totalW = g.measureText(line.text).width;
    let x = w / 2 - totalW / 2;
    chars.forEach((ch, i) => {
      const cw = g.measureText(ch.c).width;
      const lit = i < sung;
      g.fillStyle = lit ? '#78ffaa' : 'rgba(120,255,170,0.28)';
      if (lit) { g.shadowColor = '#78ffaa'; g.shadowBlur = 16 + beatPulse * 16; }
      g.fillText(ch.c, x + cw / 2, h / 2);
      g.shadowBlur = 0;
      x += cw;
    });
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (let gx = 0; gx < w; gx += 12) for (let gy = 0; gy < h; gy += 12) g.fillRect(gx, gy, 1, 1);
  }
  boardTex.needsUpdate = true;
  lastBoardIdx = curIdx;
}
drawBoard();
// 路灯
const lampMats = [];
for (const lx of [-6.5, -1.5, 3.5]) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.6, 8), std(0x2c2f36, 0.8));
  pole.position.set(lx, 2.3, 2.0); scene.add(pole);
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffe2b0, toneMapped: false });
  lampMats.push(lampMat);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), lampMat);
  lamp.position.set(lx, 4.6, 2.0); scene.add(lamp);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(1.6, 20),
    new THREE.MeshBasicMaterial({ color: 0xffe2b0, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false }));
  pool.rotation.x = -Math.PI / 2; pool.position.set(lx, 0.05, 2.0); scene.add(pool);
}
// 过车：双车道，近道往 +x、远道往 -x（靠左行驶）
const passers = [];
function makePasser(laneZ, dir, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 4.0), std(color, 0.35, 0.6));
  body.position.y = 0.55; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.5, 2.0), std(0x1a2028, 0.25, 0.4));
  cabin.position.y = 1.05; g.add(cabin);
  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff6d8, toneMapped: false });
  for (const hx of [-0.55, 0.55]) {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), headMat);
    hl.position.set(hx, 0.55, dir > 0 ? 2.02 : -2.02); g.add(hl);
  }
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a, toneMapped: false });
  for (const hx of [-0.55, 0.55]) {
    const tl = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), tailMat);
    tl.position.set(hx, 0.55, dir > 0 ? -2.02 : 2.02); g.add(tl);
  }
  g.position.set(dir > 0 ? -9 : 9, 0, laneZ);
  g.rotation.y = dir > 0 ? 0 : Math.PI;
  scene.add(g);
  return { g, laneZ, dir, speed: 3.2 + rnd01(color + laneZ) * 2.2, x: g.position.x };
}
passers.push(makePasser(3.36, 1, 0x8a2f2f));
passers.push(makePasser(4.99, -1, 0x2f4d8a));
passers.push(makePasser(3.36, 1, 0x3d6b4f));
// 雨 / 雪粒子
const FALL_N = 420, fallPos = new Float32Array(FALL_N * 3);
for (let i = 0; i < FALL_N; i++) {
  fallPos[i * 3] = (Math.random() - 0.5) * 18;
  fallPos[i * 3 + 1] = Math.random() * 10;
  fallPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
}
const fallGeo = new THREE.BufferGeometry();
fallGeo.setAttribute('position', new THREE.BufferAttribute(fallPos, 3));
const fallMat = new THREE.PointsMaterial({ color: 0xb4c8eb, size: 0.07, transparent: true, opacity: 0.0, depthWrite: false });
const fall = new THREE.Points(fallGeo, fallMat); scene.add(fall);
// 夜星
const STAR_N = 200, starPos = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 60;
  starPos[i * 3 + 1] = 12 + Math.random() * 20;
  starPos[i * 3 + 2] = -20 - Math.random() * 20;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 });
const stars = new THREE.Points(starGeo, starMat); scene.add(stars);

/* ---- 拖动调视角 ---- */
let dragging = false, px = 0, py = 0;
cv.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; ping(); });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  viewYaw = clamp(viewYaw - (e.clientX - px) * 0.004, -0.6, 0.6);
  viewPitch = clamp(viewPitch + (e.clientY - py) * 0.003, -0.25, 0.35);
  px = e.clientX; py = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('wheel', (e) => { viewZoom = clamp(viewZoom - e.deltaY * 0.0006, 0.6, 1.8); }, { passive: true });

/* ---- 主循环：暂停且无过车/天气时停 rAF，切后台也停 ---- */
let rafId = 0, lastMs = 0, loopOn = false, ambT = 0;
function frame(ms) {
  if (!loopOn) return;
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms - lastMs) / 1000 || 0.016); lastMs = ms;
  ambT += dt;
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) { curIdx = idx; drawBoard(); }
  else if (curIdx >= 0) {
    const line = lines[curIdx], chars = charsOf(line);
    let sung = 0; for (const ch of chars) if (t >= ch.t) sung++;
    if (sung !== lastBoardSung) drawBoard();
  }
  const tod = resolveTime(), wx = resolveWeather();
  applySky(tod);
  stars.visible = tod === 'night';
  const driftA = Math.sin(ambT * 0.1) * 0.5 * S.drift;
  const yaw = viewYaw + driftA * 0.12, pitch = viewPitch + Math.sin(ambT * 0.07) * 0.02 * S.drift;
  const dist = 14.2 / viewZoom;
  camera.position.set(
    CAM_HOME.look.x + Math.sin(yaw) * dist * 0.58,
    CAM_HOME.look.y + 2.4 + pitch * 4,
    CAM_HOME.look.z + Math.cos(yaw) * dist * 0.85);
  camera.lookAt(CAM_HOME.look.x, CAM_HOME.look.y + pitch * 2, CAM_HOME.look.z);
  beatPulse *= Math.exp(-dt * 3);
  boardMat.color.setScalar(0.85 + beatPulse * 0.3);
  brandMat.color.setRGB(accent[0] / 255, accent[1] / 255, accent[2] / 255);
  if (taxi.andon) taxi.andon.material.color.setScalar(0.8 + beatPulse * 0.4);
  lampMats.forEach((m, i) => m.color.setHex(0xffe2b0));
  canopyLight.intensity = tod === 'day' ? 2 : 8;
  // 过车：按车流设定速度与间距
  const moving = S.traffic > 0.02;
  if (moving) {
    for (const p of passers) {
      p.x += p.dir * p.speed * (0.3 + S.traffic) * dt;
      if (p.x > 10) p.x = -10;
      if (p.x < -10) p.x = 10;
      p.g.position.x = p.x;
    }
  }
  const falling = wx === 'rain' || wx === 'snow';
  fallMat.opacity = falling ? (wx === 'rain' ? 0.55 : 0.85) : 0;
  if (falling) {
    const fp = fallGeo.attributes.position;
    const v = wx === 'rain' ? 9 : 1.4;
    for (let i = 0; i < FALL_N; i++) {
      let y = fp.getY(i) - v * dt * (0.7 + rnd01(i) * 0.6);
      if (y < 0) y = 10;
      fp.setY(i, y);
      if (wx === 'snow') fp.setX(i, fp.getX(i) + Math.sin(ambT + i) * dt * 0.3);
    }
    fp.needsUpdate = true;
  }
  scene.fog.near = wx === 'fog' ? 8 : 20;
  scene.fog.far = wx === 'fog' ? 24 : 48;
  const ho = lines.length ? (curIdx >= 0 ? '0' : '1') : '0.5';
  if (hint.style.opacity !== ho) hint.style.opacity = ho;
  renderer.render(scene, camera);
  if (!playing && !moving && !falling) stopLoop();
}
function ensureLoop() {
  if (loopOn) return;
  loopOn = true; lastMs = performance.now();
  rafId = requestAnimationFrame(frame);
}
function stopLoop() { loopOn = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop(); else ensureLoop();
});
ensureLoop();

/* ---- 与播放器通信（__c100） ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'timeOfDay') { const s = String(v); if (['auto', 'day', 'dusk', 'night'].includes(s)) S.timeOfDay = s; }
  else if (p.key === 'weather') { const s = String(v); if (['auto', 'clear', 'rain', 'snow', 'fog'].includes(s)) S.weather = s; }
  else if (p.key === 'traffic') { const n = Number(v); if (isFinite(n)) S.traffic = clamp(n, 0, 1); }
  else if (p.key === 'drift') { const n = Number(v); if (isFinite(n)) S.drift = clamp(n, 0, 1); }
}
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    seed = hash((song && song.name) || 'station') * 1000 + 1;
    curIdx = -1; lastBoardSung = -2; lastBoardIdx = -2;
    clockT = 0; clockAt = performance.now();
    drawPylon(); drawBoard();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    ensureLoop();
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now();
    const was = playing; playing = !!d.payload.playing;
    if (playing || playing !== was) ensureLoop();
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) beatPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
    ensureLoop();
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
    ensureLoop();
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
window.__stage = () => ({ lines: lines.length, curIdx, board: lastBoardIdx, traffic: S.traffic, t: +now().toFixed(2) });
</script>
