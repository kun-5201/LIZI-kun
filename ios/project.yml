name: Lizi

options:
  bundleIdPrefix: com.lty5201
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lizi:
    type: application
    platform: iOS
    sources:
      - Sources/Lizi
      # 岛上控制 Intent（LiziIslandIntents.swift）同时编进 App target：
      # perform() 在 App 进程内跑，系统要从 App 包里发现它；扩展 target
      # 本来就编 Sources/LiziLiveActivity，同一份文件，别复制两份。
      - Sources/LiziLiveActivity/LiziIslandIntents.swift
    # public/ 是上游原封不动的前端：XcodeGen 2.46 对 Xcode 16+ 工程把
    # type: folder 的 resources 当同步组处理，../public 在工程目录外
    # 会被静默丢弃（run 43956308629 证实：archive 成功但 .app 里无 public/）。
    # 改用 post-build 脚本直接拷进 .app，Bundle 里路径保持 public/...。
    postBuildScripts:
      - name: Copy public frontend
        basedOnDependencyAnalysis: false
        script: |
          set -e
          rm -rf "$TARGET_BUILD_DIR/$PRODUCT_NAME.app/public"
          cp -R "$SRCROOT/../public" "$TARGET_BUILD_DIR/$PRODUCT_NAME.app/public"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lty5201.lizi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 灵动岛（第 16 轮第 1 项）：r15 真机 13 次 Activity.request 抛错
        # 'Target does not include NSSupportsLiveActivities plist key'——
        # 交付 IPA 的 Info.plist 里确实没有这个 key。Xcode 的
        # INFOPLIST_KEY_* 构建设置会把对应 key 写进生成的 Info.plist。
        # 注意 kun 的前车之鉴：INFOPLIST_KEY_UIBackgroundModes 不是真实
        # 构建设置、会被静默忽略，所以下面 info.properties 里同时再写一遍
        # 这两个 key（XcodeGen 生成 plist 时写进去，Xcode 再合并进产物），
        # 双保险，值一致，不冲突。只加主 App target，扩展不需要（见下）。
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: "YES"
    dependencies:
      - target: LiziLiveActivity
    info:
      path: Sources/Lizi/Info.plist
      properties:
        CFBundleDisplayName: LIZI 粒子播放器
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # 灵动岛开关（见上面 settings 注释）：主 App 的 Info.plist 必须有
        # 这两个 key，系统才允许 Activity.request；扩展的 plist 不需要——
        # 实测：酷狗主 App 有、其 Widget 扩展没有；kun 主 App 有、扩展没有。
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # 注意：这里不能再加 NSAllowsArbitraryLoads——Apple 规则（iOS 10+）：
          # NSAllowsLocalNetworking / NSAllowsArbitraryLoadsForMedia /
          # NSAllowsArbitraryLoadsInWebContent 任一在场，NSAllowsArbitraryLoads
          # 都会被系统静默忽略、按 NO 处理。build 22 就是这么死的：plist 看着
          # 放行，实际生效的 ATS 只有默认（仅 https）+ 本地联网例外，http 上游
          # 全被 -1022 拦掉。删掉这个被忽略的键，免得后人再被它骗。
          # 音频直链的放行不靠 plist 靠 https 升级：public/api.js 的
          # upgradeAudioUrl 与 Swift Upstream.upgradedAudioURL 共用同一张
          # 实测支持 https 的域名后缀表；实测过的音频域全部支持 https，
          # 所以不需要 NSExceptionDomains。127.0.0.1 本地服务靠上面这行。
        CFBundleURLTypes:
          - CFBundleURLName: com.lty5201.lizi
            CFBundleURLSchemes:
              - lizi

  # 歌词灵动岛扩展（Live Activity）：配置按 Beans/kun 的成功做法——
  # NSExtension 只写在 project.yml 的 info.properties 里（XcodeGen 每次
  # 生成工程都会重写 Info.plist 文件，手改 plist 活不到构建）；绝不写
  # NSExtensionPrincipalClass（岛上歌词项目曾因此装不上）。
  LiziLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Sources/LiziLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lty5201.lizi.LiziLiveActivity
        PRODUCT_NAME: LiziLiveActivity
    info:
      path: Sources/LiziLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: 歌词灵动岛
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ============ Lizi 原生版（P0 脚手架，NATIVE-REWRITE-PLAN.md §3）============
  # 壳版 Lizi / LiziLiveActivity 一行不改；新代码全部进 Sources/LiziNative/，
  # 新扩展视图进 Sources/LiziNativeLiveActivity/。两版 bundle ID / URL scheme
  # 不同，可同装一台手机对照。
  #
  # sources 只列 Sources/LiziNative + 逐个列出的共享文件，绝不包含整个
  # Sources/Lizi 目录（会把 WebHost / ContentView 等壳代码编进来）。
  # 清单之外多列的 5 个文件是编译必需（缺一编不过，见各行注释）；它们只
  # 编译进来，P0 不实例化、不启动（LocalHttpServer / LiziRouter 不跑），
  # 第二阶段抽 Sources/LiziShared/ 时再把 HttpRequest/HttpResponse 与
  # Upstream 从 HttpServer.swift / StaticFiles.swift 里拆出来。
  LiziNative:
    type: application
    platform: iOS
    sources:
      - Sources/LiziNative      # 壳版同款图标（只含 .xcassets 资源，不含任何壳代码）。
      - Sources/Lizi/Assets.xcassets
      # 共享后端：7 平台服务 + LX + 歌词 + 诊断 + 会话 + 加密 + 代理 + 本地文件 + 边车。
      - Sources/Lizi/Server/NetEase.swift
      - Sources/Lizi/Server/QQ.swift
      - Sources/Lizi/Server/Kugou.swift
      - Sources/Lizi/Server/Qishui.swift
      - Sources/Lizi/Server/Bodian.swift
      - Sources/Lizi/Server/Kuwo.swift
      - Sources/Lizi/Server/AppleMusic.swift
      - Sources/Lizi/Server/LX.swift
      - Sources/Lizi/Server/LXSources.swift
      - Sources/Lizi/Server/LXScriptEngine.swift
      - Sources/Lizi/Server/Lrclib.swift
      - Sources/Lizi/Server/DiagLog.swift
      - Sources/Lizi/Server/SessionStore.swift
      - Sources/Lizi/Server/Crypto.swift
      - Sources/Lizi/Server/Proxies.swift
      - Sources/Lizi/Server/LocalFiles.swift
      - Sources/Lizi/Server/Sidecars.swift
      # 清单外补 1：Sidecars.swift 实例化 SpotifyService。
      - Sources/Lizi/Server/Spotify.swift
      # 清单外补 2：各平台服务调 Upstream.fetch（定义在 StaticFiles.swift）。
      - Sources/Lizi/Server/StaticFiles.swift
      # 清单外补 3：各平台服务以 HttpRequest/HttpResponse 为入参/出参
      #（定义在 HttpServer.swift）；LocalHttpServer 本身 P0 不实例化。
      - Sources/Lizi/Server/HttpServer.swift
      # 清单外补 4：LocalHttpServer 的 init 签名要 LiziRouter 类型；
      # Router 本身 P0 不实例化。
      - Sources/Lizi/Server/Router.swift
      # 动画插图（Ken Burns 本地生成）与灵动岛管理器。
      - Sources/Lizi/AnimatedArtwork.swift
      - Sources/Lizi/LiveActivityManager.swift
      # 清单外补 5：LiveActivityManager 用 LiziLyricsAttributes（与扩展共用同一份定义）。
      - Sources/Lizi/LiziLyricsAttributes.swift
      # 岛上控制 Intent 同时编进 App target（照抄壳版做法）：perform() 在
      # App 进程内跑，系统要从 App 包里发现它；扩展 target 本来就编这份文件。
      - Sources/LiziNativeLiveActivity/LiziIslandIntents.swift
    dependencies:
      - target: LiziNativeLiveActivity
    # P3-D 打磨：Fraunces 三档静态 TTF 随包（见 Sources/LiziNative/Fonts/
    # README.md）。显式列进 resources（进包根目录，UIAppFonts 按文件名找）；
    # Assets.xcassets（平台 logo）在 Sources/LiziNative 源码 glob 里，
    # XcodeGen 按资源自动收，不另列。
    resources:
      - Sources/LiziNative/Fonts/Fraunces-Medium.ttf
      - Sources/LiziNative/Fonts/Fraunces-SemiBold.ttf
      - Sources/LiziNative/Fonts/Fraunces-Italic.ttf
      # P3-B 画廊：本地 HTML 资源整目录进包（forms-labs 整页；目录结构
      # 原样保留，`../vendor/` 相对路径才能解析；GalleryWebView 以 bundle
      # 资源根目录为 readAccess 根，见 GalleryHTMLBundle）。
      - Sources/LiziNative/Resources/GalleryHTML
      # P3-A 舞台 + P3 r19 集成去重：形态文件只此一份完整拷贝进包
      # （stages/*.html 69 个 + stages/assets/ 全部 83 个文件，形态相对
      # 引用 assets/... 才能全解析）。`stages/` 全小写，与壳版 public/
      # 下的相对引用 `stages/...` 同名；旧的第二份拷贝
      # GalleryHTML/stages/（69 html + 15 个不全的 assets，约 27MB）
      # 已删，长廊页的 stage-layer 改走 `../../stages/...`（见
      # forms-labs/js/app.js stageSrc）。304-kidcore 的
      # ../assets/fonts/ 字体放 Resources/assets/fonts/，与 stages/
      # 平级，相对路径原样解析。
      - Sources/LiziNative/Resources/stages
      - Sources/LiziNative/Resources/assets
      - Sources/LiziNative/Resources/LXSponsored
      # 赞助版 LX 源：构建机上由 secret LX_SPONSORED_URL 拉取的 linglan.js
      #（见 workflow ipa-native job「Fetch sponsored LX source script」），
      # 目录进包后原生侧按 Bundle 子目录 LXSponsored 找。目录本地只有
      # .gitkeep 占位（构建机上拉取步骤会写入 linglan.js）；secret 未配
      # 时目录为空，原生侧静默不注册该源。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lty5201.lizi-native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # plist key 双保险（照抄第 16 轮壳版做法）：INFOPLIST_KEY_* 构建设置
        # + 下面 info.properties 再写一遍，值一致。
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: "YES"
    info:
      # info.path 是 XcodeGen 必填项（缺了整个 spec 解码失败，run 44537599094
      # 证实）——它不是「读磁盘上已有的 plist」，而是 XcodeGen 生成工程时
      # 把下面 properties 写成 Info.plist 的落盘路径（构建机上生成，不进提交）。
      # 壳版 Sources/Lizi/Info.plist 同理：磁盘上不存在，构建时由 XcodeGen 生成。
      path: Sources/LiziNative/Info.plist
      properties:
        CFBundleDisplayName: LIZI 原生
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # P3-D 打磨：Fraunces 随包字体注册（族名 Fraunces；文件见
        # Sources/LiziNative/Fonts/，resources 负责拷进包）。
        # 字体进包后 DesignTokens.liziDisplay 用 Font.custom("Fraunces")。
        UIAppFonts:
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
          - Fraunces-Italic.ttf
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lty5201.lizi-native
            CFBundleURLSchemes:
              - lizinative

  # 原生版灵动岛扩展：只编 Sources/LiziNativeLiveActivity/ 下的文件
  #（壳版三份的副本 + @main 入口 LiziLiveActivityBundle.swift——没有它
  # appex 没有 WidgetBundle 入口，扩展加载不起来；与壳版同名但不同 target，
  # 不冲突）。不写 NSExtensionPrincipalClass（壳版教训）。
  LiziNativeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Sources/LiziNativeLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lty5201.lizi-native.LiziLiveActivity
        PRODUCT_NAME: LiziNativeLiveActivity
    info:
      # info.path 是 XcodeGen 必填项（见 LiziNative 的注释）：构建机上生成，
      # 不进提交。
      path: Sources/LiziNativeLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: LIZI 原生灵动岛
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
