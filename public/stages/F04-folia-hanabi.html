<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>花火 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#070510;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   花火（F04 · Folia hanabi）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 hanabi（花火）模式——
   日式歌词 PV 导演：歌词落在亮色块上、烟花与 MG 贴纸沿词绽放、整个世界
   一镜一镜往上升，像一场烟花秀。本文件只学形态与流程，按 Lizi 舞台承载
   协议（__c100）独立重写，未复制 Folia 源码；不依赖 React / Pixi。
   形态：夜空底；当前句坐在亮色块上；行变与拍点时在句边放一朵烟花（粒子
   爆开后拖尾下落）；星星贴纸沿词排布；背景随句缓缓上升。
   播放联动：init 换歌重排；tick 推时间；beat 触发烟花。
   ========================================================================== */
const S = { density: 1, blocks: true, stickers: true };
window.__stagePanel = {
  title: '花火 · Folia',
  hint: '日式歌词 PV：亮色块歌词 + 烟花与贴纸沿词绽放。',
  items: [
    { key: 'density', label: '烟花密度', type: 'range', min: 0, max: 2, step: 0.1, def: 1 },
    { key: 'blocks', label: '亮色块', type: 'switch', def: true },
    { key: 'stickers', label: 'MG 贴纸', type: 'switch', def: true },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, sparks = [], rise = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const PALETTE = [[255, 92, 138], [255, 190, 60], [90, 200, 255], [150, 255, 170], [200, 140, 255]];
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 1, color });
  }
  if (sparks.length > 420) sparks.splice(0, sparks.length - 420);
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) {
    curIdx = idx;
    if (idx >= 0 && S.density > 0) {
      const c = PALETTE[idx % PALETTE.length];
      burst(W * (0.2 + hash(lines[idx].text) * 0.6), H * (0.18 + hash(lines[idx].text + 'y') * 0.25), c, Math.round(46 * S.density));
    }
  }
  rise = (rise + 0.0004) % 1;
  // 夜空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070510'); g.addColorStop(0.6, '#14102e'); g.addColorStop(1, '#241536');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 星星（随背景缓缓上升）
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 40; i++) {
    const sx = hash('s' + i) * W, sy = ((hash('y' + i) + rise) % 1) * H;
    const r = hash('r' + i) > 0.8 ? 2 : 1;
    ctx.globalAlpha = 0.3 + 0.5 * hash('a' + i);
    ctx.fillRect(sx, sy, r, r);
  }
  ctx.globalAlpha = 1;
  // 烟花粒子
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= 0.012; s.vy += 2.2; s.x += s.vx * 0.016; s.y += s.vy * 0.016;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = rgba(s.color, Math.max(0, s.life));
    ctx.fillRect(s.x, s.y, 3, 3);
  }
  const line = lines[curIdx];
  if (line) {
    const chars = charsOf(line);
    const fs = fitFont(line.text, Math.min(W * 0.085, 60), W * 0.8, 800);
    ctx.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const by = H * 0.52, totalW = ctx.measureText(line.text).width;
    // 亮色块
    if (S.blocks) {
      const c = PALETTE[curIdx % PALETTE.length];
      ctx.save();
      ctx.translate(W / 2, by); ctx.rotate(-0.02);
      ctx.fillStyle = rgba(c, 0.92);
      ctx.fillRect(-totalW / 2 - 18, -fs * 0.72, totalW + 36, fs * 1.44);
      ctx.restore();
    }
    let x = W / 2 - totalW / 2;
    chars.forEach((ch, i) => {
      const w = ctx.measureText(ch.c).width;
      const sung = t >= ch.t;
      const pop = sung ? Math.min(1, (t - ch.t) * 8) : 0;
      ctx.save();
      ctx.translate(x + w / 2, by);
      ctx.scale(1 + (1 - pop) * 0.5, 1 + (1 - pop) * 0.5);
      ctx.fillStyle = S.blocks ? '#101014' : (sung ? '#ffffff' : rgba(accent, 0.8));
      ctx.fillText(ch.c, 0, 0);
      ctx.restore();
      // MG 贴纸：星星沿词排布
      if (S.stickers && sung) {
        const sx = x + w / 2, sy = by - fs * 0.85 - (i % 2) * 8;
        ctx.fillStyle = rgba(PALETTE[(curIdx + i) % PALETTE.length], 0.9);
        ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI * 2); ctx.fill();
      }
      x += w;
    });
    const nxt = lines[curIdx + 1];
    if (nxt) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      const nfs = fitFont(nxt.text, 18, W * 0.7, 500);
      ctx.font = `500 ${nfs}px "PingFang SC",system-ui,sans-serif`;
      ctx.fillText(nxt.text, W / 2, by + fs + 46);
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'density') { const n = Number(v); if (isFinite(n)) S.density = Math.min(2, Math.max(0, n)); }
  else if (p.key === 'blocks') S.blocks = v !== false && v !== 'false';
  else if (p.key === 'stickers') S.stickers = v !== false && v !== 'false';
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; sparks = []; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (S.density > 0 && window.__liziShake !== false) {
      const c = PALETTE[Math.max(0, curIdx) % PALETTE.length];
      burst(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.3), c, Math.round(24 * S.density));
    }
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
