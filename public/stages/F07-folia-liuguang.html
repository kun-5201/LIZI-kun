<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>流光 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#07080d;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   流光（F07 · Folia classic / Luminous）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 classic（Luminous，流光）
   模式——单行居中歌词，逐字点亮；词可旋转、呼吸浮动。本文件只学形态与流程，
   按 Lizi 舞台承载协议（__c100）独立重写，未复制 Folia 源码。
   注意：id 与文件名用 F07 / 流光，不用 classic——Lizi 已有 classic（传统
   播放器，大封面 + 歌词面板），两者效果不同，不可重名；去重见交回报告。
   形态：单行居中；已唱的字亮白带辉光，未唱的字暗淡；逐字旋转开关开时
   每个词随呼吸轻转；整行随呼吸上下浮动。
   播放联动：init 换歌重排；tick 推时间；beat 让当前字辉光一跳。
   ========================================================================== */
const S = { wordRotation: true, wordSpacing: 0.7, breathing: 1 };
window.__stagePanel = {
  title: '流光 · Folia',
  hint: '单行居中歌词，逐字点亮；词可旋转、随呼吸浮动。',
  items: [
    { key: 'wordRotation', label: '逐字旋转', type: 'switch', def: true },
    { key: 'wordSpacing', label: '字距', type: 'range', min: 0, max: 1.5, step: 0.05, def: 0.7 },
    { key: 'breathing', label: '呼吸浮动', type: 'range', min: 0, max: 2, step: 0.1, def: 1 },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, glowPulse = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) curIdx = idx;
  glowPulse *= 0.94;
  // 深底 + 封面主色晕光
  const g = ctx.createRadialGradient(W / 2, H * 0.5, 10, W / 2, H * 0.5, Math.max(W, H) * 0.7);
  g.addColorStop(0, rgba(accent, 0.16)); g.addColorStop(1, '#07080d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 底部流光线
  ctx.fillStyle = rgba(accent, 0.35);
  ctx.fillRect(0, H * 0.5 + 44, W, 1);
  const line = lines[curIdx];
  if (line) {
    const chars = charsOf(line);
    const fs = fitFont(line.text, Math.min(W * 0.085, 62), W * 0.86, 600);
    ctx.font = `600 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const breathe = Math.sin(t * 0.9) * 5 * S.breathing;
    const by = H * 0.5 + breathe;
    const gap = fs * 0.12 * S.wordSpacing;
    const totalW = chars.reduce((a, ch) => a + ctx.measureText(ch.c).width + gap, -gap);
    let x = W / 2 - totalW / 2;
    chars.forEach((ch, i) => {
      const w = ctx.measureText(ch.c).width;
      const sung = t >= ch.t;
      ctx.save();
      ctx.translate(x + w / 2, by);
      if (S.wordRotation) ctx.rotate(Math.sin(t * 0.9 + i * 0.7) * 0.06 * S.breathing);
      if (sung) {
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = rgb(accent); ctx.shadowBlur = 16 + glowPulse * 22;
      } else {
        ctx.fillStyle = rgba([255, 255, 255], 0.28);
      }
      ctx.fillText(ch.c, 0, 0);
      ctx.restore();
      x += w + gap;
    });
    const nxt = lines[curIdx + 1];
    if (nxt) {
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      const nfs = fitFont(nxt.text, 18, W * 0.7, 500);
      ctx.font = `500 ${nfs}px "PingFang SC",system-ui,sans-serif`;
      ctx.fillText(nxt.text, W / 2, by + fs + 46);
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'wordRotation') S.wordRotation = v !== false && v !== 'false';
  else if (p.key === 'wordSpacing') { const n = Number(v); if (isFinite(n)) S.wordSpacing = Math.min(1.5, Math.max(0, n)); }
  else if (p.key === 'breathing') { const n = Number(v); if (isFinite(n)) S.breathing = Math.min(2, Math.max(0, n)); }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) glowPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
