<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>浮名 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#0d0c0a;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   浮名（F10 · Folia fume）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 fume（浮名）模式——
   把整首歌词排成一篇文章，镜头在文章里穿行：主歌词超出画面边界，背后叠着
   淡化的上下文；已读的字留纸痕再淡出。本文件只学形态与流程，按 Lizi 舞台
   承载协议（__c100）独立重写，未复制 Folia 源码。
   形态：整首歌词纵向排成文章；镜头跟随当前句——当前句是超出画面边界的
   特大主字，上下文淡化在后；已读句按保留比淡出；相机跟随可切平滑/步进。
   播放联动：init 换歌重排；tick 推时间；beat 让主字辉光一跳。
   ========================================================================== */
const S = { heroScale: 1, cameraSpeed: 1, holdRatio: 1, cameraMode: 'smooth' };
window.__stagePanel = {
  title: '浮名 · Folia',
  hint: '整首歌词排成文章，镜头穿行其中，主句特大、已读句留痕淡出。',
  items: [
    { key: 'heroScale', label: '主字大小', type: 'range', min: 0.6, max: 1.6, step: 0.05, def: 1 },
    { key: 'cameraSpeed', label: '相机速度', type: 'range', min: 0.2, max: 2, step: 0.1, def: 1 },
    { key: 'holdRatio', label: '已读保留', type: 'range', min: 0, max: 1, step: 0.05, def: 1 },
    { key: 'cameraMode', label: '相机跟随', type: 'segment', def: 'smooth', options: [
      { v: 'smooth', t: '平滑' }, { v: 'stepped', t: '步进' } ] },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, camY = 0, heroPulse = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function fitFont(text, px, maxW, weight) {
  let s = px;
  ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  while (s > 12 && ctx.measureText(text).width > maxW) {
    s -= 2;
    ctx.font = `${weight || 600} ${s}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  }
  return s;
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) { curIdx = idx; if (S.cameraMode === 'stepped') camY = Math.max(0, idx); }
  heroPulse *= 0.94;
  // 纸面底
  ctx.fillStyle = '#efe9dc'; ctx.fillRect(0, 0, W, H);
  const rowH = 64;
  const targetY = Math.max(0, curIdx);
  if (S.cameraMode === 'smooth') {
    const want = targetY;
    camY += (want - camY) * Math.min(1, 0.08 * S.cameraSpeed);
  } else camY = targetY;
  const originY = H * 0.42 - camY * rowH;
  const line = lines[curIdx];
  // 文章：全部行纵向排布，当前句是特大主句
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => {
    const y = originY + i * rowH;
    if (y < -rowH || y > H + rowH) return;
    if (i === curIdx) return; // 主句单独画
    const passed = i < curIdx;
    const a = passed ? 0.16 + 0.3 * S.holdRatio : 0.4;
    ctx.fillStyle = rgba([30, 28, 24], a);
    const fs = fitFont(ln.text, 24, W * 0.86, 500);
    ctx.font = `500 ${fs}px "PingFang SC",system-ui,sans-serif`;
    ctx.fillText(ln.text, W * 0.07, y);
  });
  if (line) {
    const chars = charsOf(line);
    // 主句：特大，超出画面边界
    const fs = fitFont(line.text, Math.min(W * 0.16, 120) * S.heroScale, W * 1.15, 800);
    ctx.font = `800 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    const y = originY + curIdx * rowH;
    const totalW = ctx.measureText(line.text).width;
    let x = W * 0.07 - (totalW - W * 0.86) / 2;
    if (totalW < W * 0.86) x = W / 2 - totalW / 2;
    chars.forEach(ch => {
      const w = ctx.measureText(ch.c).width;
      const sung = t >= ch.t;
      ctx.fillStyle = sung ? '#1a1712' : 'rgba(26,23,18,0.35)';
      if (sung) { ctx.shadowColor = rgb(accent); ctx.shadowBlur = 10 + heroPulse * 18; }
      ctx.fillText(ch.c, x, y);
      ctx.shadowBlur = 0;
      x += w;
    });
    // 主句下划线
    ctx.fillStyle = rgba(accent, 0.8);
    ctx.fillRect(W * 0.07, y + fs * 0.62, Math.min(W * 0.86, totalW), 3);
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    ctx.fillStyle = 'rgba(26,23,18,0.5)';
    ctx.font = '500 20px "PingFang SC",system-ui,sans-serif';
    if (song && song.name) ctx.fillText(song.name, W * 0.07, H * 0.42);
  }
  ctx.textAlign = 'left';
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'heroScale') { const n = Number(v); if (isFinite(n)) S.heroScale = Math.min(1.6, Math.max(0.6, n)); }
  else if (p.key === 'cameraSpeed') { const n = Number(v); if (isFinite(n)) S.cameraSpeed = Math.min(2, Math.max(0.2, n)); }
  else if (p.key === 'holdRatio') { const n = Number(v); if (isFinite(n)) S.holdRatio = Math.min(1, Math.max(0, n)); }
  else if (p.key === 'cameraMode') { const s = String(v); if (s === 'smooth' || s === 'stepped') S.cameraMode = s; }
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; camY = 0; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) heroPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
