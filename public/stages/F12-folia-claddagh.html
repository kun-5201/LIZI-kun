<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>回环 · Folia</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b12;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font:500 11px/1.5 ui-monospace,Consolas,monospace;color:rgba(220,225,245,.35);
    letter-spacing:.08em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   回环（F12 · Folia claddagh）
   ----------------------------------------------------------------------------
   效果来源：Folia（AGPL-3.0，作者 chthollyphile）的 claddagh（回环）模式——
   倾斜的椭圆轨道，歌词骑在环上走，焦点字放大。本文件只学形态与流程，按
   Lizi 舞台承载协议（__c100）独立重写，未复制 Folia 源码。
   形态：倾斜椭圆轨道；当前句的字沿轨道排布，随唱到的位置推进；焦点字
   在轨道近端放大带辉光；轴线可开关。
   播放联动：init 换歌重排；tick 推时间；beat 让轨道亮度一跳。
   ========================================================================== */
const S = { tiltDeg: 20, focusScale: 1.4, axisLine: true };
window.__stagePanel = {
  title: '回环 · Folia',
  hint: '倾斜椭圆轨道，歌词骑环而行，焦点字放大。',
  items: [
    { key: 'tiltDeg', label: '轨道倾斜', type: 'range', min: 0, max: 45, step: 1, def: 20 },
    { key: 'focusScale', label: '焦点放大', type: 'range', min: 1, max: 2, step: 0.05, def: 1.4 },
    { key: 'axisLine', label: '轴线', type: 'switch', def: true },
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
window.__liziShake = true;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

let lines = [], accent = [150, 165, 255], song = null;
let clockT = 0, clockAt = performance.now(), playing = false;
let curIdx = -1, orbitPulse = 0;
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function curIdxAt(t) { let idx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].t <= t + 0.001) idx = i; else break; } return idx; }
function charsOf(line) {
  if (line.chars && line.chars.length) return line.chars;
  const cs = [...line.text], n = cs.length || 1;
  return cs.map((c, i) => ({ c, t: line.t + (line.dur || 6) * i / n }));
}
function frame() {
  requestAnimationFrame(frame);
  const t = now();
  const idx = curIdxAt(t);
  if (idx !== curIdx) curIdx = idx;
  orbitPulse *= 0.94;
  ctx.fillStyle = '#0a0b12'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.48;
  const rx = W * 0.36, ry = H * 0.16;
  const tilt = S.tiltDeg * Math.PI / 180;
  // 轨道
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-tilt);
  ctx.strokeStyle = rgba(accent, 0.5 + orbitPulse * 0.3);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = rgba(accent, 0.25);
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  if (S.axisLine) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - rx - 30, cy); ctx.lineTo(cx + rx + 30, cy); ctx.stroke();
  }
  const line = lines[curIdx];
  if (line) {
    const chars = charsOf(line);
    const fs = Math.min(W * 0.07, 48);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let focus = -1;
    chars.forEach((ch, i) => { if (t >= ch.t) focus = i; });
    const n = chars.length || 1;
    // 字沿轨道前半弧排布：从左端到右端，唱到的字推进到近端
    chars.forEach((ch, i) => {
      const frac = n === 1 ? 0.5 : i / (n - 1);
      const ang = Math.PI + frac * Math.PI; // 上半弧左→右
      const ex = Math.cos(ang) * rx, ey = Math.sin(ang) * ry;
      const x = cx + ex * Math.cos(-tilt) - ey * Math.sin(-tilt);
      const y = cy + ex * Math.sin(-tilt) + ey * Math.cos(-tilt);
      const isFocus = i === focus;
      const scale = isFocus ? S.focusScale : 0.85 + 0.15 * (1 - Math.abs(frac - 0.5) * 2);
      const sung = t >= ch.t;
      ctx.save();
      ctx.translate(x, y); ctx.scale(scale, scale);
      ctx.fillStyle = isFocus ? '#ffffff' : sung ? rgba([255, 255, 255], 0.8) : rgba(accent, 0.6);
      if (isFocus) { ctx.shadowColor = rgb(accent); ctx.shadowBlur = 18 + orbitPulse * 14; }
      ctx.fillText(ch.c, 0, 0);
      ctx.restore();
    });
    const nxt = lines[curIdx + 1];
    if (nxt) {
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      ctx.font = '500 17px "PingFang SC",system-ui,sans-serif';
      ctx.fillText(nxt.text, cx, H * 0.82);
    }
    hint.style.opacity = '0';
  } else {
    hint.style.opacity = lines.length ? '1' : '0.5';
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  }
}
requestAnimationFrame(frame);

function applySetting(p) {
  if (!p || !p.key) return;
  const v = p.value;
  if (p.key === 'tiltDeg') { const n = Number(v); if (isFinite(n)) S.tiltDeg = Math.min(45, Math.max(0, n)); }
  else if (p.key === 'focusScale') { const n = Number(v); if (isFinite(n)) S.focusScale = Math.min(2, Math.max(1, n)); }
  else if (p.key === 'axisLine') S.axisLine = v !== false && v !== 'false';
}
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    song = p.song || null;
    if (p.accent) accent = p.accent;
    curIdx = -1; clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    if (window.__liziShake !== false) orbitPulse = Math.min(1, 0.4 + (d.payload.level || 0) * 0.6);
  } else if (d.type === 'setting') {
    if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
    else applySetting(d.payload);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}
</script>
</body>
</html>
